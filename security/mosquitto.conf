per_listener_settings true
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/target-acl
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/broker.pem
keyfile /mosquitto/certs/broker-key.pem
tls_version tlsv1.3
require_certificate false

# Commands are QoS1 and Target-deduplicated. Retained publications are disabled
# broker-wide so a newly subscribing/rebooted Target can never receive a first
# retained command that PubSubClient cannot distinguish from a live delivery.
retain_available false
allow_zero_length_clientid false
check_retain_source true
