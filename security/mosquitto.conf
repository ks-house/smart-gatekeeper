per_listener_settings true
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/target-acl
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/broker.pem
keyfile /mosquitto/certs/broker-key.pem
tls_version tlsv1.3
require_certificate false

# Home Assistant discovery and bridge availability deliberately use retained
# state. Target command and ACL writers remain restricted by target-acl and
# must always publish those effect topics with retain=false; Target boot-bound
# freshness and replay ledgers provide an additional fail-closed boundary.
retain_available true
allow_zero_length_clientid false
check_retain_source true
