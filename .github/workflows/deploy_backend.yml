name: Deploy Backend to Synology NAS

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  deploy_backend:
    name: Deploy FastAPI Backend & Admin UI to NAS
    runs-on: ubuntu-latest

    steps:
      - name: Git Pull & Restart Backend Container on Synology NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          script: |
            cd /docker/smart-gatekeeper/smart-gatekeeper
            git pull origin main
            cd backend
            docker compose up -d --build api || docker compose restart api
