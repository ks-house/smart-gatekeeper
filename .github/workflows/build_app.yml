name: Build and Deploy Flutter Smart Key App APK

on:
  push:
    branches:
      - main
    paths:
      - 'gatekeeper_app/**'
      - '.github/workflows/build_app.yml'
  # 운영 APK 배포가 필요할 때만 명시적으로 실행한다.
  workflow_dispatch:

jobs:
  build_and_deploy_apk:
    name: Build Android APK & Deploy to Synology NAS
    # PR/기능 브랜치 push에서 운영 NAS 배포가 실행되지 않도록 이중 방어한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate App FULL_VERSION
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="1.0.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "App FULL_VERSION: ${FULL_VERSION}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python for OTA contract gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ota/requirements.txt

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          cd gatekeeper_app
          flutter pub get

      - name: Install and validate OTA P0 contract
        run: |
          python -m pip install -r ota/requirements.txt
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Analyze Flutter code
        run: |
          cd gatekeeper_app
          flutter analyze --no-fatal-infos

      - name: Restore Android Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > gatekeeper_app/android/app/upload-keystore.jks
            echo "✅ GitHub Secrets로부터 보안 릴리즈 키스토어 복원 완료!"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 Secret 미설정."
          fi

      - name: Create key.properties from Secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat <<EOF > gatekeeper_app/android/key.properties
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          echo "✅ android/key.properties 동적 생성 완료!"

      - name: Build Android Release APK with Dart Defines

        env:
          APK_VERSION_URL: ${{ secrets.SECRET_APK_VERSION_URL }}
          APK_DOWNLOAD_URL: ${{ secrets.SECRET_APK_DOWNLOAD_URL }}
          # 서버의 GATEKEEPER_API_KEY 환경변수와 같은 값이어야 한다 (issue.md P3-22).
          # 미설정 시 앱은 X-API-KEY 헤더를 보내지 않으며, 서버가 키를 설정한
          # 상태라면 Pre-arm 이 401 로 거부된다.
          GATEKEEPER_API_KEY: ${{ secrets.GATEKEEPER_API_KEY }}
        run: |
          cd gatekeeper_app
          flutter build apk --release \
            --build-name="${{ env.FULL_VERSION }}" \
            --build-number=${{ github.run_number }} \
            --dart-define=APK_VERSION_URL="${APK_VERSION_URL:-https://tworimpa.synology.me:4442/api/v1/download/version.json}" \
            --dart-define=APK_DOWNLOAD_URL="${APK_DOWNLOAD_URL:-https://tworimpa.synology.me:4442/api/v1/download/apk}" \
            --dart-define=GATEKEEPER_API_KEY="${GATEKEEPER_API_KEY:-}"


      - name: Prepare NAS Deployment Artifacts (ks-house-gatekeeper.apk & version.json)
        run: |
          mkdir -p dist
          cp gatekeeper_app/build/app/outputs/flutter-apk/app-release.apk dist/ks-house-gatekeeper.apk

          cat <<EOF > dist/version.json
          {
            "version": "${{ env.FULL_VERSION }}",
            "build_number": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "apk_url": "${{ secrets.SECRET_APK_DOWNLOAD_URL || 'https://tworimpa.synology.me:4442/api/v1/download/apk' }}",

            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          ls -la dist/

      - name: Upload unsigned canary APK for physical Gate validation
        uses: actions/upload-artifact@v4
        with:
          name: smart-key-app-canary-${{ env.FULL_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # This intentionally fails while ota/release-evidence.json contains a
      # pending physical Gate. The canary APK above remains downloadable for
      # emulator/device validation, but production NAS distribution is blocked.
      - name: Enforce OTA production release evidence
        env:
          OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ANDROID_SDK"
          APKSIGNER="$(find "$ANDROID_SDK/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          python scripts/ota_contract_gate.py release \
            --evidence ota/release-evidence.json \
            --manifest dist/version.json \
            --artifact dist/ks-house-gatekeeper.apk \
            --apksigner "$APKSIGNER" \
            --public-key-hex "$OTA_SIGNING_PUBLIC_KEY_HEX"

      - name: Deploy APK to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_APK_TARGET_DIR || '/docker/smartbox_ota/gatekeeper_apk/' }}

          sftp_only: true
