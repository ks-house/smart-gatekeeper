name: Build and Deploy Flutter Smart Key App APK

on:
  push:
    paths:
      - 'gatekeeper_app/**'
      - '.github/workflows/build_app.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_apk:
    name: Build Android APK & Deploy to Synology NAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate App FULL_VERSION
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="1.0.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "App FULL_VERSION: ${FULL_VERSION}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          cd gatekeeper_app
          flutter pub get

      - name: Analyze Flutter code
        run: |
          cd gatekeeper_app
          flutter analyze --no-fatal-infos

      - name: Build Android Release APK with Dart Defines
        env:
          APK_VERSION_URL: ${{ secrets.SECRET_APK_VERSION_URL }}
          APK_DOWNLOAD_URL: ${{ secrets.SECRET_APK_DOWNLOAD_URL }}
        run: |
          cd gatekeeper_app
          flutter build apk --release \
            --build-name="${{ env.FULL_VERSION }}" \
            --build-number=${{ github.run_number }} \
            --dart-define=APK_VERSION_URL="${APK_VERSION_URL:-https://tworimpa.synology.me:4443/gatekeeper_apk/version.json}" \
            --dart-define=APK_DOWNLOAD_URL="${APK_DOWNLOAD_URL:-https://tworimpa.synology.me:4443/gatekeeper_apk/ks-house-gatekeeper.apk}"

      - name: Prepare NAS Deployment Artifacts (ks-house-gatekeeper.apk & version.json)
        run: |
          mkdir -p dist
          cp gatekeeper_app/build/app/outputs/flutter-apk/app-release.apk dist/ks-house-gatekeeper.apk

          cat <<EOF > dist/version.json
          {
            "version": "${{ env.FULL_VERSION }}",
            "build_number": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "apk_url": "${{ secrets.SECRET_APK_DOWNLOAD_URL || 'https://tworimpa.synology.me:4442/api/v1/download/apk' }}",

            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          ls -la dist/

      - name: Deploy APK to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_APK_TARGET_DIR || '/docker/smartbox_ota/gatekeeper_apk/' }}

          sftp_only: true

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: smart-key-app-release
          path: dist/ks-house-gatekeeper.apk
          if-no-files-found: error
