name: Backend security and MariaDB

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_security.yml'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: migration-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -pmigration-test-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/app/requirements.txt
      - name: Validate all backend security tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Validate real MariaDB migration and immutable audit
        env:
          RUN_MARIADB_INTEGRATION: '1'
        run: python -m unittest backend.tests.test_migrations.MigrationContractTest.test_real_mariadb_up_legacy_write_down_legacy_read -v
      - name: Validate Compose is private by default
        run: docker compose -f backend/docker-compose.yml config --quiet
