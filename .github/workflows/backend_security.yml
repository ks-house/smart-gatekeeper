name: Backend security and MariaDB

on:
  workflow_dispatch:
    inputs:
      verify_ota_sftp:
        description: Verify existing OTA publisher SFTP reads over Tailscale without publishing
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'backend/**'
      - 'ops/**'
      - 'scripts/ops_commercial_gate.py'
      - '.orca/scripts/setup_worktree.ps1'
      - 'protocol/test_vectors/v1.json'
      - 'observability/event_codes_v1.json'
      - 'security/mosquitto.conf'
      - 'security/target-acl'
      - 'scripts/render_broker_acl.py'
      - 'tests/test_broker_acl_renderer.py'
      - 'tests/test_broker_acl_integration.py'
      - 'tests/test_target_security_ota.py'
      - '.github/workflows/backend_security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ops/**'
      - 'scripts/ops_commercial_gate.py'
      - '.orca/scripts/setup_worktree.ps1'
      - 'protocol/test_vectors/v1.json'
      - 'observability/event_codes_v1.json'
      - 'security/mosquitto.conf'
      - 'security/target-acl'
      - 'scripts/render_broker_acl.py'
      - 'tests/test_broker_acl_renderer.py'
      - 'tests/test_broker_acl_integration.py'
      - 'tests/test_target_security_ota.py'
      - '.github/workflows/backend_security.yml'

permissions:
  contents: read

jobs:
  backend-security:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
        env:
          MARIADB_ROOT_PASSWORD: migration-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -pmigration-test-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/app/requirements.lock
      - name: Validate all backend security tests
        run: |
          python -m unittest discover -s backend/tests -p 'test_*.py' -v
          python -m unittest tests.test_target_security_ota -v
      - name: Validate operations, privacy, production, and supply-chain contract
        env:
          API_IMAGE: ghcr.io/ks-house/smart-gatekeeper-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DB_IMAGE: ghcr.io/ks-house/smart-gatekeeper-db@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          python scripts/ops_commercial_gate.py contract
          python scripts/ops_commercial_gate.py production-compose --api-image "$API_IMAGE" --db-image "$DB_IMAGE"
          python scripts/ops_commercial_gate.py sbom --output build/backend-sbom.cdx.json
          python scripts/ops_commercial_gate.py ops-contract-evidence --result-output build/ops-contract-result.json --claim-output build/evidence/ops-contract.json --commit "${{ github.sha }}"
          python scripts/ops_commercial_gate.py evidence-claim --id hosted-sbom-attestation --payload build/backend-sbom.cdx.json --output build/evidence/hosted-sbom-attestation.json --commit "${{ github.sha }}"
          python scripts/ops_commercial_gate.py slo --samples ops/fixtures/load_nominal.jsonl --policy ops/slo_policy.json
      - name: Audit locked backend dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: backend/app/requirements.lock
      - name: Upload deterministic backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.sha }}
          path: build/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload operations contract evidence claim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-contract-${{ github.sha }}
          path: build/evidence/ops-contract.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload hosted SBOM evidence claim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-sbom-attestation-${{ github.sha }}
          path: build/evidence/hosted-sbom-attestation.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate real MariaDB migration and immutable audit
        env:
          RUN_MARIADB_INTEGRATION: '1'
        run: >-
          python -m unittest
          backend.tests.test_migrations.MigrationContractTest.test_real_mariadb_up_legacy_write_down_legacy_read
          backend.tests.test_migrations.MigrationContractTest.test_production_db_image_is_seed_free_and_upgrades_existing_volume
          -v
      - name: Validate Compose is private by default
        env:
          API_IMAGE_REPOSITORY: ghcr.io/ks-house/smart-gatekeeper-backend
          API_IMAGE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DB_IMAGE_REPOSITORY: ghcr.io/ks-house/smart-gatekeeper-db
          DB_IMAGE_DIGEST: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MQTT_HOST: broker.invalid
          MQTT_PORT: '4883'
          MQTT_USER: ci-only
          DB_RUNTIME_USER: gatekeeper_runtime
          COMMAND_TARGET_ID: ci-target
          COMMAND_TENANT_ID: ci-tenant
          COMMAND_DOOR_ID: ci-door
          COMMAND_SIGNING_KEY_ID: '1'
          ADMIN_TRUSTED_PROXY_IPS: '127.0.0.1'
          ACL_SIGNING_KEY_ID: '1'
          BUILD_SHA: ${{ github.sha }}
          SGK_SECRET_DIR: /tmp/sgk-ci-secrets
          MARIADB_DATA_VOLUME: ci-existing-db
          API_STATE_VOLUME: ci-api-state
          APK_ARTIFACTS_VOLUME: ci-apk-artifacts
          MIGRATION_BACKUPS_VOLUME: ci-migration-backups
        run: |
          set -a
          . backend/db/schema.env
          set +a
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f backend/compose.production.yml config --quiet
          docker compose -f backend/compose.production.yml -f backend/compose.synology.yml config --quiet
          docker build -f backend/app/Dockerfile backend/app
          docker build -f backend/db/Dockerfile backend/db

  attest-backend-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Generate exact-main operations and SBOM claims
        run: |
          python scripts/ops_commercial_gate.py sbom --output build/backend-sbom.cdx.json
          python scripts/ops_commercial_gate.py ops-contract-evidence --result-output build/ops-contract-result.json --claim-output build/evidence/ops-contract.json --commit "${{ github.sha }}"
          python scripts/ops_commercial_gate.py evidence-claim --id hosted-sbom-attestation --payload build/backend-sbom.cdx.json --output build/evidence/hosted-sbom-attestation.json --commit "${{ github.sha }}"
      - name: Attest operations contract claim
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: build/evidence/ops-contract.json
      - name: Attest hosted SBOM claim
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: build/evidence/hosted-sbom-attestation.json

  verify-operations-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-security, attest-backend-evidence]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Verify evidence through GitHub APIs and generate exact-main register
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ops_commercial_gate.py evidence
          --source ops/evidence_sources.json
          --output build/ops-evidence-register.json
          --commit "${{ github.sha }}"
      - name: Upload verified operations evidence register
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-evidence-${{ github.sha }}
          path: build/ops-evidence-register.json
          if-no-files-found: error
          retention-days: 30

  publish_backend_images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-operations-evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api_image: ghcr.io/ks-house/smart-gatekeeper-backend@${{ steps.build_api.outputs.digest }}
      db_image: ghcr.io/ks-house/smart-gatekeeper-db@${{ steps.build_db.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish exact API image
        id: build_api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/app
          file: backend/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ks-house/smart-gatekeeper-backend:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sgk-backend-api
          cache-to: type=gha,mode=max,scope=sgk-backend-api
      - name: Build and publish exact database image
        id: build_db
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/db
          file: backend/db/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ks-house/smart-gatekeeper-db:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sgk-backend-db
          cache-to: type=gha,mode=max,scope=sgk-backend-db
      - name: Attest API image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/ks-house/smart-gatekeeper-backend
          subject-digest: ${{ steps.build_api.outputs.digest }}
          push-to-registry: true
      - name: Attest database image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/ks-house/smart-gatekeeper-db
          subject-digest: ${{ steps.build_db.outputs.digest }}
          push-to-registry: true

  nas_private_status_preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.verify_ota_sftp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: smart-gatekeeper-nas-production
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join NAS status network with an ephemeral Tailscale node
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:sgk-github-deploy
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
      - name: Configure restricted NAS status identity
        env:
          NAS_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.NAS_DEPLOY_SSH_PRIVATE_KEY }}
          NAS_DEPLOY_KNOWN_HOSTS: ${{ secrets.NAS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/sgk-ssh" build
          printf '%s\n' "$NAS_DEPLOY_SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/sgk-ssh/id_ed25519"
          printf '%s\n' "$NAS_DEPLOY_KNOWN_HOSTS" > "${RUNNER_TEMP}/sgk-ssh/known_hosts"
          ssh-keygen -y -f "${RUNNER_TEMP}/sgk-ssh/id_ed25519" >/dev/null
          test -s "${RUNNER_TEMP}/sgk-ssh/known_hosts"
      - name: Verify private forced status endpoint without deployment
        env:
          NAS_HOST: ${{ vars.NAS_TAILSCALE_HOST }}
          NAS_PORT: ${{ vars.NAS_DEPLOY_PORT }}
          NAS_USER: ${{ vars.NAS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "${RUNNER_TEMP}/sgk-ssh/id_ed25519"
            -p "$NAS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/sgk-ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$NAS_USER@$NAS_HOST" status \
            | tee build/nas-private-status.evidence
          test "$(grep -Ec '^status=(not-deployed|deployed)$' build/nas-private-status.evidence)" -eq 1
      - name: Upload NAS private status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nas-private-status-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/nas-private-status.evidence
          if-no-files-found: error
          retention-days: 30

  ota_private_sftp_preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_ota_sftp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: smart-gatekeeper-personal-ota-preflight
      cancel-in-progress: false
    environment: personal-auto-ota
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Prepare private OTA read-only receipt
        run: |
          set -euo pipefail
          umask 077
          mkdir -p build
          printf 'private_sftp_readonly_started=true\n' > build/ota-private-sftp.evidence
      - name: Select OTA publication transport without fallback
        id: ota_transport
        env:
          OTA_PUBLISH_TRANSPORT: tailscale
          PUBLIC_NAS_HOST: ${{ secrets.NAS_HOST }}
          PUBLIC_NAS_PORT: ${{ secrets.NAS_PORT || 22 }}
          PUBLIC_NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
          TAILNET_NAS_HOST: ${{ vars.NAS_OTA_TAILNET_HOST }}
          TAILNET_NAS_PORT: ${{ vars.NAS_OTA_TAILNET_PORT || 4222 }}
          TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress
          import os
          from pathlib import Path
          import re
          import secrets
          import subprocess
          import tempfile

          mode = os.environ.get("OTA_PUBLISH_TRANSPORT", "") or "public"
          if mode not in {"public", "tailscale"}:
              raise SystemExit("unsupported OTA publication transport")
          private = mode == "tailscale"
          prefix = "TAILNET" if private else "PUBLIC"
          host = os.environ.get(prefix + "_NAS_HOST", "")
          port = os.environ.get(prefix + "_NAS_PORT", "")
          known = os.environ.get("PUBLIC_NAS_KNOWN_HOSTS", "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,252}", host):
              raise SystemExit("invalid OTA publisher host")
          if not re.fullmatch(r"[0-9]{1,5}", port) or not 1 <= int(port) <= 65535:
              raise SystemExit("invalid OTA publisher port")
          port = str(int(port))
          if not known.strip():
              raise SystemExit("pinned OTA publisher host identity required")
          if private:
              try:
                  address = ipaddress.IPv4Address(host)
              except ipaddress.AddressValueError:
                  raise SystemExit("literal Tailscale IPv4 required") from None
              if address not in ipaddress.IPv4Network("100.64.0.0/10"):
                  raise SystemExit("OTA publisher is outside Tailscale address range")
              if not all(os.environ.get(k, "").strip() for k in ("TS_OIDC_CLIENT_ID", "TS_OIDC_AUDIENCE")):
                  raise SystemExit("private publisher identity is not configured")
              public_host = os.environ.get("PUBLIC_NAS_HOST", "")
              public_port = os.environ.get("PUBLIC_NAS_PORT", "")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,252}", public_host):
                  raise SystemExit("invalid original publisher identity")
              if not re.fullmatch(r"[0-9]{1,5}", public_port) or not 1 <= int(public_port) <= 65535:
                  raise SystemExit("invalid original publisher port")
              public_port = str(int(public_port))
              public_label = public_host if public_port == "22" else "[" + public_host + "]:" + public_port
              private_label = host if port == "22" else "[" + host + "]:" + port
              with tempfile.NamedTemporaryFile(mode="w+", encoding="utf-8") as pin:
                  pin.write(known)
                  pin.flush()
                  found = subprocess.run(["ssh-keygen", "-F", public_label, "-f", pin.name],
                                         capture_output=True, text=True, check=False)
                  if found.returncode:
                      raise SystemExit("original publisher host pin is missing")
                  rebound = []
                  for line in found.stdout.splitlines():
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split()
                      if len(parts) < 3 or parts[0].startswith("@"):
                          raise SystemExit("unsupported original publisher host pin")
                      rebound.append(private_label + " " + parts[1] + " " + parts[2])
                  if not rebound:
                      raise SystemExit("original publisher host pin is missing")
                  known = "\n".join(rebound) + "\n"
                  pin.seek(0)
                  pin.truncate()
                  pin.write(known)
                  pin.flush()
                  valid = subprocess.run(["ssh-keygen", "-l", "-E", "sha256", "-f", pin.name],
                                         capture_output=True, check=False)
                  if valid.returncode:
                      raise SystemExit("invalid original publisher host key")
          values = {"mode": mode, "host": host, "port": port, "known_hosts": known}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  marker = "SGK_" + secrets.token_hex(16)
                  output.write(key + "<<" + marker + "\n" + value + "\n" + marker + "\n")
          PY

      - name: Join private OTA publisher network
        if: steps.ota_transport.outputs.mode == 'tailscale'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:sgk-github-ota
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32

      - name: Install client for opt-in private SFTP read-only preflight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Verify existing OTA publisher identity over private SFTP without publishing
        env:
          NAS_HOST: ${{ steps.ota_transport.outputs.host }}
          NAS_PORT: ${{ steps.ota_transport.outputs.port }}
          NAS_KNOWN_HOSTS: ${{ steps.ota_transport.outputs.known_hosts }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_TARGET_DIR: ${{ secrets.NAS_TARGET_DIR || '/docker/smartbox_ota/firmware/' }}
          NAS_APK_TARGET_DIR: ${{ secrets.NAS_APK_TARGET_DIR }}
          NAS_APK_FALLBACK_TARGET_DIR: ${{ secrets.NAS_APK_FALLBACK_TARGET_DIR || '/docker/smartbox_ota/gatekeeper_apk_fallback' }}
        run: |
          set -euo pipefail
          umask 077
          for key in NAS_HOST NAS_PORT NAS_USER NAS_PASSWORD NAS_TARGET_DIR NAS_APK_TARGET_DIR NAS_APK_FALLBACK_TARGET_DIR; do
            test -n "${!key}"
          done
          python - <<'PY'
          import ipaddress, os
          address = ipaddress.IPv4Address(os.environ["NAS_HOST"])
          assert address in ipaddress.IPv4Network("100.64.0.0/10"), "Tailscale IPv4 required"
          PY
          [[ "$NAS_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$NAS_PORT >= 1 && 10#$NAS_PORT <= 65535))
          [[ "$NAS_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$ ]]
          for directory in "$NAS_TARGET_DIR" "$NAS_APK_TARGET_DIR" "$NAS_APK_FALLBACK_TARGET_DIR"; do
            [[ "$directory" =~ ^/[A-Za-z0-9._/-]{1,300}$ ]]
            [[ "/$directory/" != *"/../"* ]]
          done
          mkdir -p "${RUNNER_TEMP}/sgk-ssh"
          pin="${RUNNER_TEMP}/sgk-ssh/known_hosts"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$pin"
          label="$NAS_HOST"
          if [[ "$NAS_PORT" != 22 ]]; then label="[$NAS_HOST]:$NAS_PORT"; fi
          ssh-keygen -F "$label" -f "$pin" >/dev/null
          batch="${RUNNER_TEMP}/sgk-private-sftp-readonly.batch"
          printf 'cd "%s"\npwd\ncd "%s"\npwd\ncd "%s"\npwd\n' \
            "$NAS_TARGET_DIR" "$NAS_APK_TARGET_DIR" "$NAS_APK_FALLBACK_TARGET_DIR" > "$batch"
          export SSHPASS="$NAS_PASSWORD"
          private_log="${RUNNER_TEMP}/sgk-private-sftp-readonly.private"
          if timeout 60s sshpass -e sftp -N -o BatchMode=no -b "$batch" -P "$NAS_PORT" \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$pin" "$NAS_USER@$NAS_HOST" > "$private_log" 2>&1; then
            unset SSHPASS NAS_PASSWORD
            printf 'private_sftp_readonly_ok=true\n' >> build/ota-private-sftp.evidence
          else
            export SFTP_EXIT_CODE="$?"
            unset SSHPASS NAS_PASSWORD
            python - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "sgk-private-sftp-readonly.private").read_bytes()[:32768].decode(errors="replace")
          code = int(os.environ["SFTP_EXIT_CODE"])
          category = "SFTP_CLIENT_FAILURE"
          if code == 124:
              category = "NETWORK_TIMEOUT"
          elif re.search(r"host key verification failed|host identification has changed", raw, re.I):
              category = "HOST_IDENTITY"
          elif code == 5 or re.search(r"Permission denied.*password|Authentication failed", raw, re.I):
              category = "AUTHENTICATION"
          elif re.search(r"subsystem request failed", raw, re.I):
              category = "SFTP_SUBSYSTEM"
          elif re.search(r"No such file|couldn.t canonicalize|not found", raw, re.I):
              category = "REMOTE_DIRECTORY"
          elif re.search(r"Permission denied", raw, re.I):
              category = "REMOTE_PERMISSION"
          with Path("build/ota-private-sftp.evidence").open("a") as evidence:
              evidence.write("private_sftp_readonly_ok=false\n")
              evidence.write("private_sftp_failure_category=" + category + "\n")
              evidence.write("private_sftp_exit_code=" + str(code) + "\n")
          print("Private SFTP read-only preflight failed: " + category + "; no publication attempted.")
          PY
            exit 1
          fi

      - name: Upload private OTA SFTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-private-sftp-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/ota-private-sftp.evidence
          if-no-files-found: error
          retention-days: 30

  deploy_backend_to_nas:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish_backend_images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: smart-gatekeeper-nas-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.NAS_PUBLIC_API_URL }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Create signed exact-digest NAS release bundle
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.NAS_BACKEND_RELEASE_SIGNING_KEY_PEM }}
          API_IMAGE: ${{ needs.publish_backend_images.outputs.api_image }}
          DB_IMAGE: ${{ needs.publish_backend_images.outputs.db_image }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p build
          signing_key="${RUNNER_TEMP}/nas-backend-release-signing.pem"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -noout -check >/dev/null
          python backend/deploy/create_release_bundle.py \
            --source-sha "${{ github.sha }}" \
            --api-image "$API_IMAGE" \
            --db-image "$DB_IMAGE" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-attempt "${{ github.run_attempt }}" \
            --signing-key "$signing_key" \
            --output build/backend-release.tar.gz
          rm -f "$signing_key"
      - name: Attest signed deployment bundle
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: build/backend-release.tar.gz
      - name: Upload signed deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/backend-release.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Join NAS deployment network with an ephemeral Tailscale node
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:sgk-github-deploy
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
      - name: Configure restricted NAS SSH identity
        env:
          NAS_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.NAS_DEPLOY_SSH_PRIVATE_KEY }}
          NAS_DEPLOY_KNOWN_HOSTS: ${{ secrets.NAS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/sgk-ssh"
          printf '%s\n' "$NAS_DEPLOY_SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/sgk-ssh/id_ed25519"
          printf '%s\n' "$NAS_DEPLOY_KNOWN_HOSTS" > "${RUNNER_TEMP}/sgk-ssh/known_hosts"
          ssh-keygen -y -f "${RUNNER_TEMP}/sgk-ssh/id_ed25519" >/dev/null
          test -s "${RUNNER_TEMP}/sgk-ssh/known_hosts"
      - name: Deploy and verify NAS readiness
        env:
          NAS_HOST: ${{ vars.NAS_TAILSCALE_HOST }}
          NAS_PORT: ${{ vars.NAS_DEPLOY_PORT }}
          NAS_USER: ${{ vars.NAS_DEPLOY_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          ssh_options=(
            -i "${RUNNER_TEMP}/sgk-ssh/id_ed25519"
            -p "$NAS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/sgk-ssh/known_hosts"
          )
          ghcr_auth_b64="$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 --wrap=0)"
          {
            printf 'SGK-GHCR-AUTH-V1\n%s\n' "$ghcr_auth_b64"
            cat build/backend-release.tar.gz
          } | ssh "${ssh_options[@]}" "$NAS_USER@$NAS_HOST" apply \
            | tee build/nas-deployment.evidence
          unset ghcr_auth_b64
          grep -Fqx 'status=deployed' build/nas-deployment.evidence
          grep -Fqx 'source_sha=${{ github.sha }}' build/nas-deployment.evidence
          ssh "${ssh_options[@]}" "$NAS_USER@$NAS_HOST" status \
            > build/nas-status.evidence
          cmp build/nas-deployment.evidence build/nas-status.evidence
      - name: Upload NAS deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nas-deployment-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build/nas-deployment.evidence
            build/nas-status.evidence
          if-no-files-found: error
          retention-days: 30
