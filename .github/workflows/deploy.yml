name: SmartGatekeeper CI/CD Pipeline

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'include/**'
      - 'src/**'
      - 'platformio.ini'
      - 'partitions_*MB_ota.csv'
      - 'ota/**'
      - 'scripts/ota_contract_gate.py'
      - 'tests/test_ota_contract_gate.py'
      - 'tests/test_nas_physical_test_delivery.py'
      - 'tests/test_target_ota_autopublish.py'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_target:
        description: Build a canary or request an authorized production release
        required: true
        type: choice
        default: canary
        options:
          - canary
          - physical-test-canary
          - physical-test-connected
          - production
      allow_unpinned_host_key:
        description: Acknowledge MITM risk when NAS_KNOWN_HOSTS is absent for physical-test-canary
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test and build firmware canary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Install PlatformIO
        run: python -m pip install --require-hashes -r ota/requirements.lock

      - name: Validate OTA P0 contract
        run: |
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create compile-only public canary secrets
        run: cp include/secrets.h.example include/secrets.h

      - name: Build ESP32-C6 firmware public canary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "Building public canary version: ${FULL_VERSION}"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6

      - name: Prepare signed public firmware canary
        run: |
          mkdir -p dist
          cp .pio/build/esp32c6/firmware.bin dist/gatekeeper-firmware.bin
          # Public RFC 8032 test vector seed; never a production credential.
          RFC8032_TEST_SEED_HEX="9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60"
          export RFC8032_TEST_SEED_HEX
          python scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/version.json \
            --version "${{ env.FULL_VERSION }}" \
            --commit "${{ github.sha }}" \
            --build-id "public-canary-${{ github.sha }}" \
            --artifact-url "https://target-canary.invalid/smart-gatekeeper/gatekeeper-firmware-${{ github.sha }}.bin" \
            --published-at "2026-08-01T00:00:00Z" \
            --signing-key-id "rfc8032-test-key-1" \
            --private-key-env RFC8032_TEST_SEED_HEX \
            --expected-public-key-hex "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"
          python scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a" \
            --expected-version "${{ env.FULL_VERSION }}" \
            --expected-commit "${{ github.sha }}" \
            --expected-build-id "public-canary-${{ github.sha }}"
          ls -la dist/

      - name: Upload non-secret symbol map for remote crash analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-symbol-map-${{ env.FULL_VERSION }}-attempt-${{ github.run_attempt }}
          path: .pio/build/esp32c6/firmware.map
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned canary artifacts for physical Gate validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-canary-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy_physical_test_canary:
    name: Publish firmware public canary to isolated NAS physical-test storage
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'physical-test-canary' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main physical-test verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact-run firmware canary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: target-canary-attempt-${{ github.run_attempt }}
          path: dist

      - name: Set up Python for physical-test verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Install physical-test verification dependencies
        run: python -m pip install --require-hashes -r ota/requirements.lock

      - name: Verify exact public firmware canary before NAS contact
        run: |
          python scripts/ota_contract_gate.py physical-test-canary-verify \
            --kind target \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --expected-commit "${{ github.sha }}"

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client sshpass

      - name: Stage, read back, verify and publish isolated firmware canary
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_PORT: ${{ secrets.NAS_PORT || 22 }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in NAS_HOST NAS_USER NAS_PASSWORD NAS_PORT; do
            test -n "${!name}"
          done
          [[ "$NAS_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$NAS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$NAS_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$NAS_PORT >= 1 && 10#$NAS_PORT <= 65535))
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          REMOTE_ROOT="/docker/smart-gatekeeper-physical-test/firmware-public-canary"
          REMOTE_PARENT="${REMOTE_ROOT}/${GITHUB_SHA}"
          REMOTE_STAGE="${REMOTE_PARENT}/.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_FINAL="${REMOTE_PARENT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$REMOTE_ROOT" = "/docker/smart-gatekeeper-physical-test/firmware-public-canary"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/nas_known_hosts"
          if [[ -n "${NAS_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$NAS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
            HOST_KEY_MODE="repository-secret-pinned"
          else
            test "${{ inputs.allow_unpinned_host_key }}" = "true"
            for attempt in 1 2 3; do
              if timeout 10s ssh-keyscan -T 5 -p "$NAS_PORT" -- "$NAS_HOST" > "${KNOWN_HOSTS_FILE}.scan" 2>/dev/null; then
                mv "${KNOWN_HOSTS_FILE}.scan" "$KNOWN_HOSTS_FILE"
                break
              fi
            done
            rm -f "${KNOWN_HOSTS_FILE}.scan"
            HOST_KEY_MODE="runtime-keyscan-unpinned"
            echo "::warning::NAS_KNOWN_HOSTS is not configured; using runtime ssh-keyscan for this physical-test upload"
          fi
          test -s "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"
          ssh-keygen -l -E sha256 -f "$KNOWN_HOSTS_FILE" >/dev/null
          export SSHPASS="$NAS_PASSWORD"
          SSH_TARGET="${NAS_USER}@${NAS_HOST}"
          SSH_OPTIONS=(-o BatchMode=no -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}")
          timeout 300s sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          -mkdir /docker
          -mkdir /docker/smart-gatekeeper-physical-test
          -mkdir $REMOTE_ROOT
          -mkdir $REMOTE_PARENT
          mkdir $REMOTE_STAGE
          put dist/gatekeeper-firmware.bin $REMOTE_STAGE/gatekeeper-firmware.bin
          put dist/version.json $REMOTE_STAGE/version.json
          EOF
          mkdir -p readback evidence
          timeout 300s sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          get $REMOTE_STAGE/gatekeeper-firmware.bin readback/gatekeeper-firmware.bin
          get $REMOTE_STAGE/version.json readback/version.json
          EOF
          python scripts/ota_contract_gate.py physical-test-evidence-create \
            --kind target \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --readback-manifest readback/version.json \
            --readback-artifact readback/gatekeeper-firmware.bin \
            --expected-commit "$GITHUB_SHA" \
            --host-key-mode "$HOST_KEY_MODE" \
            --remote-path "$REMOTE_FINAL" \
            --output evidence/firmware-physical-test-evidence.json
          timeout 120s sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          put evidence/firmware-physical-test-evidence.json $REMOTE_STAGE/evidence.json
          get $REMOTE_STAGE/evidence.json readback/evidence.json
          EOF
          cmp evidence/firmware-physical-test-evidence.json readback/evidence.json
          timeout 30s sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          rename $REMOTE_STAGE $REMOTE_FINAL
          EOF
          unset SSHPASS NAS_PASSWORD NAS_KNOWN_HOSTS

      - name: Upload sanitized firmware physical-test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-physical-test-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: evidence/firmware-physical-test-evidence.json
          if-no-files-found: error
          retention-days: 30

  validate_connected_physical_test_prerequisites:
    name: Fail closed until connected firmware physical-test secrets are provisioned
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'physical-test-connected' &&
      github.ref == 'refs/heads/main'
    environment: physical-test
    runs-on: ubuntu-24.04
    steps:
      - name: Validate connected firmware physical-test secret contract
        env:
          PHYSICAL_TEST_ROOT_CA_CERT: ${{ secrets.PHYSICAL_TEST_ROOT_CA_CERT }}
          PHYSICAL_TEST_WIFI_SSID: ${{ secrets.PHYSICAL_TEST_WIFI_SSID }}
          PHYSICAL_TEST_WIFI_PASSWORD: ${{ secrets.PHYSICAL_TEST_WIFI_PASSWORD }}
          PHYSICAL_TEST_API_URL: ${{ secrets.PHYSICAL_TEST_API_URL }}
          PHYSICAL_TEST_API_KEY: ${{ secrets.PHYSICAL_TEST_API_KEY }}
          PHYSICAL_TEST_MQTT_HOST: ${{ secrets.PHYSICAL_TEST_MQTT_HOST }}
          PHYSICAL_TEST_MQTT_PORT: ${{ secrets.PHYSICAL_TEST_MQTT_PORT }}
          PHYSICAL_TEST_MQTT_USER: ${{ secrets.PHYSICAL_TEST_MQTT_USER }}
          PHYSICAL_TEST_MQTT_PASSWORD: ${{ secrets.PHYSICAL_TEST_MQTT_PASSWORD }}
          PHYSICAL_TEST_TARGET_TENANT_ID: ${{ secrets.PHYSICAL_TEST_TARGET_TENANT_ID }}
          PHYSICAL_TEST_TARGET_DOOR_ID: ${{ secrets.PHYSICAL_TEST_TARGET_DOOR_ID }}
          PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID }}
          PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_ACL_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_ACL_SIGNING_KEY_ID }}
          PHYSICAL_TEST_OTA_VERSION_URL: ${{ secrets.PHYSICAL_TEST_OTA_VERSION_URL }}
          PHYSICAL_TEST_OTA_FIRMWARE_URL: ${{ secrets.PHYSICAL_TEST_OTA_FIRMWARE_URL }}
          PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX }}
          PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_OTA_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_KEY_ID }}
          PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD }}
          PHYSICAL_TEST_LOCAL_RECOVERY_USER: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_USER }}
          PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in PHYSICAL_TEST_ROOT_CA_CERT PHYSICAL_TEST_WIFI_SSID \
            PHYSICAL_TEST_WIFI_PASSWORD PHYSICAL_TEST_API_URL PHYSICAL_TEST_API_KEY \
            PHYSICAL_TEST_MQTT_HOST PHYSICAL_TEST_MQTT_PORT PHYSICAL_TEST_MQTT_USER \
            PHYSICAL_TEST_MQTT_PASSWORD PHYSICAL_TEST_TARGET_TENANT_ID \
            PHYSICAL_TEST_TARGET_DOOR_ID PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX \
            PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX \
            PHYSICAL_TEST_ACL_SIGNING_KEY_ID PHYSICAL_TEST_OTA_VERSION_URL \
            PHYSICAL_TEST_OTA_FIRMWARE_URL PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX \
            PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX PHYSICAL_TEST_OTA_SIGNING_KEY_ID \
            PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD PHYSICAL_TEST_LOCAL_RECOVERY_USER \
            PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD; do
            test -n "${!name}" || missing+=("$name")
          done
          if ((${#missing[@]})); then
            printf 'Missing connected physical-test secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          printf '%s\n' 'Connected signed firmware lane remains disabled until a separately reviewed implementation is authorized.' >&2
          exit 1

  build_personal_target_ota_firmware:
    name: Build exact-main personal Target firmware with runtime inputs
    needs: test_and_build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_target == 'canary'))
    environment: personal-auto-ota
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main OTA source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for exact-main OTA
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Install exact-main OTA dependencies
        run: python -I -m pip install --require-hashes -r ota/requirements.lock

      - name: Verify exact protected main before production secrets
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "${{ inputs.release_target }}" = "canary"
          else
            test "$GITHUB_EVENT_NAME" = "push"
          fi
          # This privileged runner never executes candidate tests. The
          # secretless test_and_build job already validated the exact SHA.
          # Keep the auto-compiled Target tree closed so a newly added source,
          # local library or interpreter startup hook cannot reach later secrets.
          EXPECTED_BUILD_TREE="$(cat <<'EOF'
          100644 87508551abdc0eee107eb879bc979c7bb93e8032d166c716df159ad469602eac include/BleStartupPolicy.h
          100644 9979085720f5b860d8135737b64269cedc6ec42515c352e6a65ac7a6b1c9466f include/ConfigManager.h
          100644 9ebeac418fe2cd0c858889206bda9c4f0a45250eafe4c9276ba848ea0f09f29b include/DiagnosticsManager.h
          100644 bab4d5f0cf614e0dfe060c7896ae0fc8be8b1cdaa86a8fe44437471ee9f03864 include/DurablePreferences.h
          100644 0b5d72d267b6cf82bbb51dada969b132ad8700517c7fa473b28c2dac4b45861e include/FlatJsonObjectPolicy.h
          100644 da900d01180a01f203c47a7bc455e8fc5aa3ad9da03c9df292663a49facb491c include/GattProtocol.h
          100644 252f9dbd64cb3e54484906254d13e0d56c69ece91270c3b6f075c53d683de6e3 include/GattServer.h
          100644 95cac78789291570be6c0a58fe17020e98a856139d46236e4bbb816323814de3 include/MqttManager.h
          100644 c002d43122a1f1be3b9509f784aba872ca84d666a24d0738dea7a59adcb15592 include/OfflineEventQueue.h
          100644 a42780d48211f0306f8278298ee7b598d349c52b0ba2e4913223a60bf30426c1 include/OtaHealthPolicy.h
          100644 333dbe7e825443210fad253d11722b70b6df2067a2f888f2810f7adfa83d7d6f include/OtaManager.h
          100644 ade406347069742dec9139e011e6a45a897a9f0a75f2e30a24debb9f7074d8aa include/OtaVersionPolicy.h
          100644 3e25df300a313b8081e0c1bbba8b43e04aa5d8d439226c303d560d24e801ff79 include/RecoveryRadioPolicy.h
          100644 199bd44240f7df0082ee065ac715f47c03ef893e7d86d9a129df820969e35164 include/RelayController.h
          100644 4a248b958f18f903cc6a3a9a76a40fbba7d323b6b0e7934dd53216250f263d95 include/TargetAccessFsm.h
          100644 72ae43ed6754c63d1b7fa2113504be8ea7f5b2865cfc9daf0c95917ae9894f81 include/TargetAclManager.h
          100644 656941b67a9eef62964d8578d3959ded1a041b558d7caebe6ee14c1e4389108a include/TargetCommandSecurity.h
          100644 b565052cc9df2933376cd059c5d74dfc0e66af24e79a65caa5eec96a4db5880f include/TargetProofVerifier.h
          100644 83fd17527d6f4558ff868d58814ec69f3a38f75c220ea381531d1140a7c3085d include/TargetState.h
          100644 a46484bd8d6b2985378a50e1912778801dc78279ffc3abbe24242b4fc3309b3d include/UltrasonicSensor.h
          100644 e27c075c08668543c10336746a26bbe33f2ff42e72a7c34837368a8ad951269b include/config.h
          100644 7fb16bde7025386547d2e3b6e90f2236ad00e2695eb04c7f4f3947e503450fd8 include/secrets.h.example
          100644 5b8c5859426a7febd6bd9d9b0482bf78f8f4854c2d83d0ce53ba49c14c5cea12 ota/requirements.lock
          100644 20eb6e06d094abfa4436abf741fe21652e4b92ec076d24dbc0eac8e7d2ed88b4 partitions_16MB_ota.csv
          100644 a10ccb9f2216d8b46ab3869a20d228c4c39aa7630b5c672f01be97f8ce7ce839 platformio.ini
          100644 54dad6206a9a9bd9bbe245313b34c690fc3f4ce066ad01eb3e8b3b3223696f07 src/ConfigManager.cpp
          100644 8c53bdaa676fc2f79014578233f2ac6ec961d1061d070b909f493439406ebc39 src/DiagnosticsManager.cpp
          100644 b4b5ce7c3193cf3b59542501e52dd15458dcd75fb3f467c3da83ad2f9733cd5e src/GattProtocol.cpp
          100644 fee22c57f0ec9a771675cbb025e03159a3bb2f72a6774208ad95a0b2825cadfa src/GattServer.cpp
          100644 d14e6d7aa05a2e5cf4233e3e9e955e99de195f8c25390bd13da185dbc2283205 src/MqttManager.cpp
          100644 99e45cfec3094c95efbef4a7802ba12a881c4e2c93dcce81eaae92ab083ab346 src/OfflineEventQueue.cpp
          100644 36f1db079f0ea65feb175c7fcf5d079b1e9952ad40e98607036874f252f3cea7 src/OtaManager.cpp
          100644 a127d320e18e357ada7bcea38d9706cbd017ba78c6a9fb800c356766c33570af src/OtaVersionPolicy.cpp
          100644 447ef319af59cc3316ec6e2e1bb2a62a5a8d2b33efecb399653234e321aa1fea src/RelayController.cpp
          100644 3e3b7819e7095cf23066d85f7b2a58906fbac3e5ade7c2a663c38c0bf1d8c20c src/TargetAccessFsm.cpp
          100644 7ce6135340065ef6f03afc2fa41a9ac79a04ac5a277d7edb946c388bd6eead61 src/TargetAclManager.cpp
          100644 b280393bfc93b0a3d09e6869621c3d8b8a27937f1d85f8afb6a24df204279596 src/TargetCommandSecurity.cpp
          100644 248edb5e1c5c67b1a87c4bb7fda2a9dead4eb6f043ef50e6a58c175634e0a291 src/TargetProofVerifier.cpp
          100644 43cae85d91cdffc87a4c0905cc5812c0a715bb4bca0a6498194f5cf106bc76c7 src/UltrasonicSensor.cpp
          100644 9f71191acdb9d068503f02feddf27d40b12f4fcbcf83b86a5df2e88c1439f1c3 src/WifiManager.cpp
          100644 7a60cf5487282008b7dc8097e51d6d734ceeade429c7484bdeccfcb3e553072d src/WifiManager.h
          100644 404fee5326d4ade190d4a1d8cc76ebf1bff9cf68f249f636de14824b48401a75 src/main.cpp
          EOF
          )"
          test ! -e .pio
          UNEXPECTED_BUILD_INPUTS="$(git ls-files --others --exclude-standard -- \
            src include lib boards variants sitecustomize.py usercustomize.py \
            platformio_override.ini platformio.ini partitions_16MB_ota.csv \
            ota/requirements.lock)"
          test -z "$UNEXPECTED_BUILD_INPUTS"
          ACTUAL_BUILD_TREE="$(git ls-files --stage -- src include lib boards variants \
            sitecustomize.py usercustomize.py platformio_override.ini platformio.ini \
            partitions_16MB_ota.csv ota/requirements.lock | \
            while read -r mode object stage path; do
              test "$stage" = "0"
              test "$mode" = "100644"
              test -f "$path"
              test ! -L "$path"
              test "$(stat -c '%a' -- "$path")" = "644"
              digest="$(sha256sum -- "$path" | cut -d' ' -f1)"
              printf '%s %s %s\n' "$mode" "$digest" "$path"
            done)"
          test "$ACTUAL_BUILD_TREE" = "$EXPECTED_BUILD_TREE"

      - name: Materialize personal Target production inputs
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
          SECRET_WIFI_SSID: ${{ secrets.SECRET_WIFI_SSID }}
          SECRET_WIFI_PASSWORD: ${{ secrets.SECRET_WIFI_PASSWORD }}
          SECRET_API_URL: ${{ secrets.SECRET_API_URL }}
          SECRET_API_KEY: ${{ secrets.SECRET_API_KEY }}
          SECRET_MQTT_HOST: ${{ secrets.SECRET_MQTT_HOST }}
          SECRET_MQTT_PORT: ${{ secrets.SECRET_MQTT_PORT }}
          SECRET_MQTT_USER: ${{ secrets.SECRET_MQTT_USER }}
          SECRET_MQTT_PASSWORD: ${{ secrets.SECRET_MQTT_PASSWORD }}
          SECRET_TARGET_TENANT_ID: ${{ secrets.SECRET_TARGET_TENANT_ID }}
          SECRET_TARGET_DOOR_ID: ${{ secrets.SECRET_TARGET_DOOR_ID }}
          SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_COMMAND_SIGNING_KEY_ID: ${{ secrets.SECRET_COMMAND_SIGNING_KEY_ID }}
          SECRET_HARDWARELESS_DOOR_ID_HEX: ${{ secrets.SECRET_HARDWARELESS_DOOR_ID_HEX }}
          SECRET_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_ACL_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_ACL_SIGNING_KEY_ID: ${{ secrets.SECRET_ACL_SIGNING_KEY_ID }}
          SECRET_OTA_VERSION_URL: ${{ secrets.SECRET_OTA_VERSION_URL }}
          SECRET_OTA_FIRMWARE_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          SECRET_OTA_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          SECRET_OTA_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          SECRET_OTA_CONTENT_KEY_HEX: ${{ secrets.SECRET_OTA_CONTENT_KEY_HEX }}
          SECRET_OTA_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
          SECRET_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_AP_PASSWORD }}
          SECRET_LOCAL_RECOVERY_USER: ${{ secrets.SECRET_LOCAL_RECOVERY_USER }}
          SECRET_LOCAL_RECOVERY_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          fail_secret_contract() {
            printf '::error::Personal Target secret contract failed: %s\n' "$1" >&2
            exit 1
          }
          require_cpp_string() {
            local name="$1"
            local value="${!name}"
            test -n "$value" || fail_secret_contract "$name is empty"
            [[ "$value" != *'"'* && "$value" != *'\'* && \
               "$value" != *$'\n'* && "$value" != *$'\r'* ]] || \
              fail_secret_contract "$name contains an unsupported C-string character"
          }
          for name in SECRET_WIFI_SSID SECRET_WIFI_PASSWORD SECRET_API_URL \
            SECRET_API_KEY SECRET_MQTT_HOST SECRET_MQTT_USER \
            SECRET_MQTT_PASSWORD SECRET_TARGET_TENANT_ID SECRET_TARGET_DOOR_ID \
            SECRET_OTA_VERSION_URL SECRET_OTA_FIRMWARE_URL \
            SECRET_OTA_SIGNING_KEY_ID SECRET_LOCAL_RECOVERY_AP_PASSWORD \
            SECRET_LOCAL_RECOVERY_USER SECRET_LOCAL_RECOVERY_PASSWORD; do
            require_cpp_string "$name"
          done
          test -n "$SECRET_ROOT_CA_CERT" || fail_secret_contract "SECRET_ROOT_CA_CERT is empty"
          [[ "$SECRET_MQTT_PORT" =~ ^[0-9]{1,5}$ ]] || fail_secret_contract "SECRET_MQTT_PORT format"
          ((10#$SECRET_MQTT_PORT >= 1 && 10#$SECRET_MQTT_PORT <= 65535)) || fail_secret_contract "SECRET_MQTT_PORT range"
          [[ "$SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX" =~ ^04[0-9a-f]{128}$ ]] || fail_secret_contract "SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX format"
          [[ "$SECRET_COMMAND_SIGNING_KEY_ID" =~ ^[1-9][0-9]*$ ]] || fail_secret_contract "SECRET_COMMAND_SIGNING_KEY_ID format"
          [[ "$SECRET_HARDWARELESS_DOOR_ID_HEX" =~ ^[0-9a-f]{32}$ ]] || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX format"
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "00000000000000000000000000000000" || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX all-zero"
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "ffffffffffffffffffffffffffffffff" || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX all-FF"
          [[ "$SECRET_ACL_SIGNER_PUBLIC_KEY_HEX" =~ ^04[0-9a-f]{128}$ ]] || fail_secret_contract "SECRET_ACL_SIGNER_PUBLIC_KEY_HEX format"
          [[ "$SECRET_ACL_SIGNING_KEY_ID" =~ ^[1-9][0-9]{0,9}$ ]] || fail_secret_contract "SECRET_ACL_SIGNING_KEY_ID format"
          ((10#$SECRET_ACL_SIGNING_KEY_ID <= 4294967295)) || fail_secret_contract "SECRET_ACL_SIGNING_KEY_ID range"
          [[ "$SECRET_OTA_SIGNER_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]] || fail_secret_contract "OTA_SIGNING_PUBLIC_KEY_HEX format"
          test "$SECRET_OTA_SIGNING_KEY_ID" = "personal-target-auto-20260823-1" || fail_secret_contract "OTA_SIGNING_KEY_ID identity"
          OTA_PUBLIC_KEY_SHA256="$(printf '%s' "$SECRET_OTA_SIGNER_PUBLIC_KEY_HEX" | xxd -r -p | sha256sum | cut -d' ' -f1)"
          test "$OTA_PUBLIC_KEY_SHA256" = "65154566393ecfb249c8aceb637e3258e349eb36e4dbca0dd52d61a6e55cb61b" || fail_secret_contract "OTA_SIGNING_PUBLIC_KEY_HEX identity"
          [[ "$SECRET_OTA_CONTENT_KEY_HEX" =~ ^[0-9a-f]{64}$ ]] || fail_secret_contract "SECRET_OTA_CONTENT_KEY_HEX format"
          test "$SECRET_OTA_CONTENT_KEY_ID" = "personal-target-content-20260824-1" || fail_secret_contract "SECRET_OTA_CONTENT_KEY_ID identity"
          test "${#SECRET_LOCAL_RECOVERY_AP_PASSWORD}" -ge 16 || fail_secret_contract "SECRET_LOCAL_RECOVERY_AP_PASSWORD length"
          test "${#SECRET_LOCAL_RECOVERY_USER}" -ge 8 || fail_secret_contract "SECRET_LOCAL_RECOVERY_USER length"
          test "${#SECRET_LOCAL_RECOVERY_PASSWORD}" -ge 16 || fail_secret_contract "SECRET_LOCAL_RECOVERY_PASSWORD length"
          cat <<EOF > include/secrets.h
          #pragma once
          #define SECRET_WIFI_SSID "${SECRET_WIFI_SSID}"
          #define SECRET_WIFI_PASSWORD "${SECRET_WIFI_PASSWORD}"
          #define SECRET_API_URL "${SECRET_API_URL}"
          #define SECRET_API_KEY "${SECRET_API_KEY}"
          #define SECRET_TEST_BLE_MAC "AA:BB:CC:DD:EE:01"
          #define SECRET_HARDWARELESS_DOOR_ID_HEX "${SECRET_HARDWARELESS_DOOR_ID_HEX}"
          #define SECRET_ACL_SIGNER_PUBLIC_KEY_HEX "${SECRET_ACL_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_ACL_SIGNING_KEY_ID ${SECRET_ACL_SIGNING_KEY_ID}
          #define SECRET_MQTT_HOST "${SECRET_MQTT_HOST}"
          #define SECRET_MQTT_PORT ${SECRET_MQTT_PORT}
          #define SECRET_MQTT_USER "${SECRET_MQTT_USER}"
          #define SECRET_MQTT_PASSWORD "${SECRET_MQTT_PASSWORD}"
          #define SECRET_TARGET_TENANT_ID "${SECRET_TARGET_TENANT_ID}"
          #define SECRET_TARGET_DOOR_ID "${SECRET_TARGET_DOOR_ID}"
          #define SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX "${SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_COMMAND_SIGNING_KEY_ID ${SECRET_COMMAND_SIGNING_KEY_ID}
          #define SECRET_OTA_VERSION_URL "${SECRET_OTA_VERSION_URL}"
          #define SECRET_OTA_FIRMWARE_URL "${SECRET_OTA_FIRMWARE_URL}"
          #define SECRET_APK_VERSION_URL "https://mobile-release.invalid/version.json"
          #define SECRET_APK_DOWNLOAD_URL "https://mobile-release.invalid/app.apk"
          #define SECRET_OTA_SIGNER_PUBLIC_KEY_HEX "${SECRET_OTA_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_OTA_SIGNING_KEY_ID "${SECRET_OTA_SIGNING_KEY_ID}"
          #define SECRET_OTA_CONTENT_KEY_HEX "${SECRET_OTA_CONTENT_KEY_HEX}"
          #define SECRET_OTA_CONTENT_KEY_ID "${SECRET_OTA_CONTENT_KEY_ID}"
          #define SECRET_LOCAL_RECOVERY_AP_PASSWORD "${SECRET_LOCAL_RECOVERY_AP_PASSWORD}"
          #define SECRET_LOCAL_RECOVERY_USER "${SECRET_LOCAL_RECOVERY_USER}"
          #define SECRET_LOCAL_RECOVERY_PASSWORD "${SECRET_LOCAL_RECOVERY_PASSWORD}"
          EOF
          printf '#define SECRET_ROOT_CA_CERT R"(\n%s\n)"\n' "$SECRET_ROOT_CA_CERT" >> include/secrets.h

      - name: Build exact monotonic N16 production firmware
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_SEQUENCE=$(git rev-list --count --first-parent HEAD)
          [[ "$COMMIT_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          FULL_VERSION="2.1.${COMMIT_SEQUENCE}+main.g${SHORT_SHA}"
          TARGET_BUILD_ID="main-${COMMIT_SEQUENCE}-${GITHUB_SHA}"
          export FULL_VERSION TARGET_BUILD_ID
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_BUILD_ID=${TARGET_BUILD_ID}" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[1-9][0-9]*$ ]]
          export SOURCE_DATE_EPOCH
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          python -I -m platformio run -e esp32c6_personal_production
          mkdir -p dist
          cp .pio/build/esp32c6_personal_production/firmware.bin dist/gatekeeper-firmware-first.bin
          python -I -m platformio run -e esp32c6_personal_production -t clean
          python -I -m platformio run -e esp32c6_personal_production
          cmp dist/gatekeeper-firmware-first.bin .pio/build/esp32c6_personal_production/firmware.bin
          python -I - <<'PY'
          import os
          from pathlib import Path

          firmware = Path(".pio/build/esp32c6_personal_production/firmware.bin").read_bytes()
          version = os.environ["FULL_VERSION"].encode("ascii")
          if version not in firmware:
              raise SystemExit("exact Target version is absent from firmware bytes")
          PY
          python -I scripts/verify_target_flash_layout.py \
            --partitions partitions_16MB_ota.csv \
            --firmware .pio/build/esp32c6_personal_production/firmware.bin \
            --flash-size 0x1000000 \
            --max-slot-usage-percent 80
          cp .pio/build/esp32c6_personal_production/firmware.bin dist/gatekeeper-firmware.bin
          test -s dist/gatekeeper-firmware.bin

      - name: Encrypt sensitive Target firmware handoff
        env:
          TARGET_HANDOFF_PUBLIC_KEY_HEX: ${{ secrets.TARGET_HANDOFF_PUBLIC_KEY_HEX }}
          TARGET_HANDOFF_KEY_ID: ${{ secrets.TARGET_HANDOFF_KEY_ID }}
        run: |
          set -euo pipefail
          test "$TARGET_HANDOFF_KEY_ID" = "personal-target-handoff-20260824-1"
          [[ "$TARGET_HANDOFF_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          HANDOFF_PUBLIC_SHA256="$(printf '%s' "$TARGET_HANDOFF_PUBLIC_KEY_HEX" | xxd -r -p | sha256sum | cut -d' ' -f1)"
          test "$HANDOFF_PUBLIC_SHA256" = "b46f35bed26b7542c9103c1006ff90816e2e8758ebfc1fd9c53cab4561ec829f"
          python -I scripts/ota_contract_gate.py target-handoff-encrypt \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/gatekeeper-firmware.sgkenc \
            --recipient-public-key-hex "$TARGET_HANDOFF_PUBLIC_KEY_HEX" \
            --commit "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          test -s dist/gatekeeper-firmware.sgkenc
          rm -f dist/gatekeeper-firmware.bin dist/gatekeeper-firmware-first.bin
          test ! -e dist/gatekeeper-firmware.bin

      - name: Upload short-lived encrypted Target firmware handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-target-firmware-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/gatekeeper-firmware.sgkenc
          if-no-files-found: error
          retention-days: 1

  publish_personal_target_ota:
    name: Sign and atomically publish exact-main personal Target OTA
    needs: build_personal_target_ota_firmware
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_target == 'canary'))
    environment: personal-auto-ota
    concurrency:
      group: smart-gatekeeper-personal-target-ota-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact protected Target publisher inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts/ota_contract_gate.py
            scripts/verify_target_flash_layout.py
            ota/requirements.lock
            ota/schemas/target-manifest.schema.json
            partitions_16MB_ota.csv
          sparse-checkout-cone-mode: false

      - name: Set up Python for isolated Target publisher
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Verify exact main and install isolated Target publisher dependencies
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "${{ inputs.release_target }}" = "canary"
          else
            test "$GITHUB_EVENT_NAME" = "push"
          fi
          python -I -m pip install --no-cache-dir --require-hashes -r ota/requirements.lock

      - name: Download exact sensitive Target firmware handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-target-firmware-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: sensitive-handoff

      - name: Validate encrypted Target handoff inventory
        run: |
          set -euo pipefail
          mapfile -t HANDOFF_ENTRIES < <(find sensitive-handoff -mindepth 1 -maxdepth 1 -printf '%y %p\n')
          test "${#HANDOFF_ENTRIES[@]}" -eq 1
          test "${HANDOFF_ENTRIES[0]}" = "f sensitive-handoff/gatekeeper-firmware.sgkenc"
          test ! -L sensitive-handoff/gatekeeper-firmware.sgkenc
          test -s sensitive-handoff/gatekeeper-firmware.sgkenc

      - name: Decrypt authenticated Target firmware handoff
        env:
          TARGET_HANDOFF_PRIVATE_KEY_HEX: ${{ secrets.TARGET_HANDOFF_PRIVATE_KEY_HEX }}
          TARGET_HANDOFF_PUBLIC_KEY_HEX: ${{ secrets.TARGET_HANDOFF_PUBLIC_KEY_HEX }}
          TARGET_HANDOFF_KEY_ID: ${{ secrets.TARGET_HANDOFF_KEY_ID }}
        run: |
          set -euo pipefail
          test "$TARGET_HANDOFF_KEY_ID" = "personal-target-handoff-20260824-1"
          [[ "$TARGET_HANDOFF_PRIVATE_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TARGET_HANDOFF_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          HANDOFF_PUBLIC_SHA256="$(printf '%s' "$TARGET_HANDOFF_PUBLIC_KEY_HEX" | xxd -r -p | sha256sum | cut -d' ' -f1)"
          test "$HANDOFF_PUBLIC_SHA256" = "b46f35bed26b7542c9103c1006ff90816e2e8758ebfc1fd9c53cab4561ec829f"
          mkdir -p dist
          export TARGET_HANDOFF_PRIVATE_KEY_HEX
          python -I scripts/ota_contract_gate.py target-handoff-decrypt \
            --input sensitive-handoff/gatekeeper-firmware.sgkenc \
            --output dist/gatekeeper-firmware.bin \
            --private-key-env TARGET_HANDOFF_PRIVATE_KEY_HEX \
            --recipient-public-key-hex "$TARGET_HANDOFF_PUBLIC_KEY_HEX" \
            --commit "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          test -s dist/gatekeeper-firmware.bin
          rm -f sensitive-handoff/gatekeeper-firmware.sgkenc
          rmdir sensitive-handoff

      - name: Validate Target firmware before signing secrets
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          COMMIT_SEQUENCE="$(git rev-list --count --first-parent HEAD)"
          [[ "$COMMIT_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          FULL_VERSION="2.1.${COMMIT_SEQUENCE}+main.g${SHORT_SHA}"
          TARGET_BUILD_ID="main-${COMMIT_SEQUENCE}-${GITHUB_SHA}"
          export FULL_VERSION TARGET_BUILD_ID
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_BUILD_ID=${TARGET_BUILD_ID}" >> "$GITHUB_ENV"
          python -I - <<'PY'
          import os
          from pathlib import Path

          firmware = Path("dist/gatekeeper-firmware.bin").read_bytes()
          if len(firmware) > 0x700000:
              raise SystemExit("Target firmware exceeds the N16 OTA slot")
          version = os.environ["FULL_VERSION"].encode("ascii")
          if firmware.count(version) < 1:
              raise SystemExit("exact Target version is absent from firmware bytes")
          PY
          python -I scripts/verify_target_flash_layout.py \
            --partitions partitions_16MB_ota.csv \
            --firmware dist/gatekeeper-firmware.bin \
            --flash-size 0x1000000 \
            --max-slot-usage-percent 80

      - name: Encrypt Target OTA content for public NAS delivery
        env:
          TARGET_CONTENT_KEY_HEX: ${{ secrets.SECRET_OTA_CONTENT_KEY_HEX }}
          TARGET_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
        run: |
          set -euo pipefail
          [[ "$TARGET_CONTENT_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          test "$TARGET_CONTENT_KEY_ID" = "personal-target-content-20260824-1"
          export TARGET_CONTENT_KEY_HEX
          ROUNDTRIP="${RUNNER_TEMP}/gatekeeper-firmware-roundtrip.bin"
          trap 'rm -f "$ROUNDTRIP"' EXIT
          python -I scripts/ota_contract_gate.py target-content-encrypt \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/gatekeeper-firmware.sgkenc \
            --key-env TARGET_CONTENT_KEY_HEX \
            --key-id "$TARGET_CONTENT_KEY_ID" \
            --commit "$GITHUB_SHA"
          python -I scripts/ota_contract_gate.py target-content-decrypt \
            --input dist/gatekeeper-firmware.sgkenc \
            --output "$ROUNDTRIP" \
            --key-env TARGET_CONTENT_KEY_HEX \
            --key-id "$TARGET_CONTENT_KEY_ID" \
            --commit "$GITHUB_SHA"
          cmp dist/gatekeeper-firmware.bin "$ROUNDTRIP"
          rm -f "$ROUNDTRIP"
          trap - EXIT
          test -s dist/gatekeeper-firmware.sgkenc
          test -s dist/gatekeeper-firmware.bin

      - name: Create exact production-signed immutable Target manifest
        env:
          TARGET_ARTIFACT_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          TARGET_PRIVATE_KEY_HEX: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_HEX }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          TARGET_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          TARGET_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$TARGET_ARTIFACT_URL"
          test -n "$TARGET_PRIVATE_KEY_HEX"
          test -n "$TARGET_PUBLIC_KEY_HEX"
          test -n "$TARGET_SIGNING_KEY_ID"
          test "$TARGET_CONTENT_KEY_ID" = "personal-target-content-20260824-1"
          [[ "$TARGET_ARTIFACT_URL" =~ ^https://[^[:space:]?#]+/[^/?#]+$ ]]
          IMMUTABLE_ARTIFACT_URL="${TARGET_ARTIFACT_URL%/*}/gatekeeper-firmware-${GITHUB_SHA}.sgkenc"
          export TARGET_PRIVATE_KEY_HEX
          PUBLISHED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -I scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.sgkenc \
            --output dist/version.json \
            --version "$FULL_VERSION" \
            --commit "$GITHUB_SHA" \
            --build-id "$TARGET_BUILD_ID" \
            --artifact-url "$IMMUTABLE_ARTIFACT_URL" \
            --plaintext-artifact dist/gatekeeper-firmware.bin \
            --encryption-key-id "$TARGET_CONTENT_KEY_ID" \
            --published-at "$PUBLISHED_AT" \
            --signing-key-id "$TARGET_SIGNING_KEY_ID" \
            --private-key-env TARGET_PRIVATE_KEY_HEX \
            --expected-public-key-hex "$TARGET_PUBLIC_KEY_HEX"
          python -I scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.sgkenc \
            --public-key-hex "$TARGET_PUBLIC_KEY_HEX" \
            --expected-version "$FULL_VERSION" \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-id "$TARGET_BUILD_ID" \
            --expected-encryption-key-id "$TARGET_CONTENT_KEY_ID"
          rm -f dist/gatekeeper-firmware.bin
          test ! -e dist/gatekeeper-firmware.bin

      - name: Stage read back and atomically publish Target OTA
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_PORT: ${{ secrets.NAS_PORT || 22 }}
          NAS_TARGET_DIR: ${{ secrets.NAS_TARGET_DIR || '/docker/smartbox_ota/firmware/' }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          for name in NAS_HOST NAS_USER NAS_PASSWORD NAS_PORT NAS_TARGET_DIR TARGET_PUBLIC_KEY_HEX; do
            test -n "${!name}"
          done
          [[ "$NAS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$NAS_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$NAS_PORT >= 1 && 10#$NAS_PORT <= 65535))
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/nas_target_ota_known_hosts"
          test -n "$NAS_KNOWN_HOSTS"
          HOST_KEY_MODE="repository-secret-pinned"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          test -s "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"
          ssh-keygen -l -E sha256 -f "$KNOWN_HOSTS_FILE" >/dev/null
          export OTA_NAS_KNOWN_HOSTS_FILE="$KNOWN_HOSTS_FILE"
          export OTA_NAS_HOST_KEY_MODE="$HOST_KEY_MODE"
          python -I scripts/ota_contract_gate.py target-sftp-publish \
            --artifact dist/gatekeeper-firmware.sgkenc \
            --manifest dist/version.json \
            --expected-version "$FULL_VERSION" \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-id "$TARGET_BUILD_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-output dist/target-ota-publish-evidence.json
          unset NAS_PASSWORD NAS_KNOWN_HOSTS OTA_NAS_KNOWN_HOSTS_FILE

      - name: Verify exact Target OTA pointer and immutable artifact over HTTPS
        env:
          TARGET_VERSION_URL: ${{ secrets.SECRET_OTA_VERSION_URL }}
          TARGET_FIRMWARE_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          TARGET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
          TARGET_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
        run: |
          set -euo pipefail
          [[ "$TARGET_VERSION_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$TARGET_FIRMWARE_URL" =~ ^https://[^[:space:]?#]+/[^/?#]+$ ]]
          test -n "$TARGET_ROOT_CA_CERT"
          test "$TARGET_CONTENT_KEY_ID" = "personal-target-content-20260824-1"
          CA_FILE="${RUNNER_TEMP}/target-ota-root-ca.pem"
          printf '%s\n' "$TARGET_ROOT_CA_CERT" > "$CA_FILE"
          chmod 600 "$CA_FILE"
          trap 'rm -f "$CA_FILE"' EXIT
          IMMUTABLE_ARTIFACT_URL="${TARGET_FIRMWARE_URL%/*}/gatekeeper-firmware-${GITHUB_SHA}.sgkenc"
          mkdir -p https-readback
          fetch_exact() {
            local url="$1"
            local destination="$2"
            local expected="$3"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' --cacert "$CA_FILE" \
                  --connect-timeout 10 --max-time 180 \
                  -H 'Cache-Control: no-cache' \
                  --output "$destination" "$url" && cmp "$expected" "$destination"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          fetch_exact "$TARGET_VERSION_URL" https-readback/version.json dist/version.json
          fetch_exact "$IMMUTABLE_ARTIFACT_URL" https-readback/gatekeeper-firmware.sgkenc dist/gatekeeper-firmware.sgkenc
          python -I scripts/ota_contract_gate.py target-manifest-verify \
            --manifest https-readback/version.json \
            --artifact https-readback/gatekeeper-firmware.sgkenc \
            --public-key-hex "$TARGET_PUBLIC_KEY_HEX" \
            --expected-version "$FULL_VERSION" \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-id "$TARGET_BUILD_ID" \
            --expected-encryption-key-id "$TARGET_CONTENT_KEY_ID"

      - name: Upload sanitized Target OTA publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-ota-publish-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/target-ota-publish-evidence.json
          if-no-files-found: error
          retention-days: 30

  release_to_production:
    name: Block commercial firmware release pending encrypted-v2 migration
    needs: test_and_build
    if: >-
      false &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'production' &&
      github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Install PlatformIO and OTA release gate dependencies
        run: python -m pip install --require-hashes -r ota/requirements.lock

      - name: Verify exact protected main release source
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create production firmware build secrets
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
          SECRET_WIFI_SSID: ${{ secrets.SECRET_WIFI_SSID }}
          SECRET_WIFI_PASSWORD: ${{ secrets.SECRET_WIFI_PASSWORD }}
          SECRET_API_URL: ${{ secrets.SECRET_API_URL }}
          SECRET_API_KEY: ${{ secrets.SECRET_API_KEY }}
          SECRET_MQTT_HOST: ${{ secrets.SECRET_MQTT_HOST }}
          SECRET_MQTT_PORT: ${{ secrets.SECRET_MQTT_PORT }}
          SECRET_MQTT_USER: ${{ secrets.SECRET_MQTT_USER }}
          SECRET_MQTT_PASSWORD: ${{ secrets.SECRET_MQTT_PASSWORD }}
          SECRET_TARGET_TENANT_ID: ${{ secrets.SECRET_TARGET_TENANT_ID }}
          SECRET_TARGET_DOOR_ID: ${{ secrets.SECRET_TARGET_DOOR_ID }}
          SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_COMMAND_SIGNING_KEY_ID: ${{ secrets.SECRET_COMMAND_SIGNING_KEY_ID }}
          SECRET_HARDWARELESS_DOOR_ID_HEX: ${{ secrets.SECRET_HARDWARELESS_DOOR_ID_HEX }}
          SECRET_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_ACL_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_ACL_SIGNING_KEY_ID: ${{ secrets.SECRET_ACL_SIGNING_KEY_ID }}
          SECRET_OTA_VERSION_URL: ${{ secrets.SECRET_OTA_VERSION_URL }}
          SECRET_OTA_FIRMWARE_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          SECRET_OTA_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          SECRET_OTA_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          SECRET_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_AP_PASSWORD }}
          SECRET_LOCAL_RECOVERY_USER: ${{ secrets.SECRET_LOCAL_RECOVERY_USER }}
          SECRET_LOCAL_RECOVERY_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_PASSWORD }}
        run: |
          for name in SECRET_ROOT_CA_CERT SECRET_WIFI_SSID SECRET_WIFI_PASSWORD \
            SECRET_API_URL SECRET_API_KEY SECRET_MQTT_HOST SECRET_MQTT_PORT \
            SECRET_MQTT_USER SECRET_MQTT_PASSWORD SECRET_TARGET_TENANT_ID \
            SECRET_TARGET_DOOR_ID SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX \
            SECRET_COMMAND_SIGNING_KEY_ID SECRET_HARDWARELESS_DOOR_ID_HEX \
            SECRET_ACL_SIGNER_PUBLIC_KEY_HEX \
            SECRET_ACL_SIGNING_KEY_ID SECRET_OTA_VERSION_URL \
            SECRET_OTA_FIRMWARE_URL SECRET_OTA_SIGNER_PUBLIC_KEY_HEX \
            SECRET_OTA_SIGNING_KEY_ID SECRET_LOCAL_RECOVERY_AP_PASSWORD \
            SECRET_LOCAL_RECOVERY_USER SECRET_LOCAL_RECOVERY_PASSWORD; do
            test -n "${!name}"
          done
          [[ "$SECRET_HARDWARELESS_DOOR_ID_HEX" =~ ^[0-9a-f]{32}$ ]]
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "00000000000000000000000000000000"
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "ffffffffffffffffffffffffffffffff"
          [[ "$SECRET_ACL_SIGNER_PUBLIC_KEY_HEX" =~ ^04[0-9a-f]{128}$ ]]
          [[ "$SECRET_ACL_SIGNING_KEY_ID" =~ ^[1-9][0-9]{0,9}$ ]]
          ((10#$SECRET_ACL_SIGNING_KEY_ID <= 4294967295))
          cat <<EOF > include/secrets.h
          #pragma once
          #define SECRET_WIFI_SSID "${SECRET_WIFI_SSID}"
          #define SECRET_WIFI_PASSWORD "${SECRET_WIFI_PASSWORD}"
          #define SECRET_API_URL "${SECRET_API_URL}"
          #define SECRET_API_KEY "${SECRET_API_KEY}"
          #define SECRET_TEST_BLE_MAC "AA:BB:CC:DD:EE:01"
          #define SECRET_HARDWARELESS_DOOR_ID_HEX "${SECRET_HARDWARELESS_DOOR_ID_HEX}"
          #define SECRET_ACL_SIGNER_PUBLIC_KEY_HEX "${SECRET_ACL_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_ACL_SIGNING_KEY_ID ${SECRET_ACL_SIGNING_KEY_ID}
          #define SECRET_MQTT_HOST "${SECRET_MQTT_HOST}"
          #define SECRET_MQTT_PORT ${SECRET_MQTT_PORT}
          #define SECRET_MQTT_USER "${SECRET_MQTT_USER}"
          #define SECRET_MQTT_PASSWORD "${SECRET_MQTT_PASSWORD}"
          #define SECRET_TARGET_TENANT_ID "${SECRET_TARGET_TENANT_ID}"
          #define SECRET_TARGET_DOOR_ID "${SECRET_TARGET_DOOR_ID}"
          #define SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX "${SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_COMMAND_SIGNING_KEY_ID ${SECRET_COMMAND_SIGNING_KEY_ID}
          #define SECRET_OTA_VERSION_URL "${SECRET_OTA_VERSION_URL}"
          #define SECRET_OTA_FIRMWARE_URL "${SECRET_OTA_FIRMWARE_URL}"
          #define SECRET_APK_VERSION_URL "https://mobile-release.invalid/version.json"
          #define SECRET_APK_DOWNLOAD_URL "https://mobile-release.invalid/app.apk"
          #define SECRET_OTA_SIGNER_PUBLIC_KEY_HEX "${SECRET_OTA_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_OTA_SIGNING_KEY_ID "${SECRET_OTA_SIGNING_KEY_ID}"
          #define SECRET_LOCAL_RECOVERY_AP_PASSWORD "${SECRET_LOCAL_RECOVERY_AP_PASSWORD}"
          #define SECRET_LOCAL_RECOVERY_USER "${SECRET_LOCAL_RECOVERY_USER}"
          #define SECRET_LOCAL_RECOVERY_PASSWORD "${SECRET_LOCAL_RECOVERY_PASSWORD}"
          EOF
          printf '#define SECRET_ROOT_CA_CERT R"(\n%s\n)"\n' "$SECRET_ROOT_CA_CERT" >> include/secrets.h

      - name: Build exact production firmware
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6_personal_production
          mkdir -p dist
          cp .pio/build/esp32c6_personal_production/firmware.bin dist/gatekeeper-firmware.bin
          test -s dist/gatekeeper-firmware.bin

      - name: Create production signed Target manifest
        env:
          TARGET_ARTIFACT_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          TARGET_PRIVATE_KEY_HEX: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_HEX }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          TARGET_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
        run: |
          test -n "$TARGET_ARTIFACT_URL"
          test -n "$TARGET_PRIVATE_KEY_HEX"
          test -n "$TARGET_PUBLIC_KEY_HEX"
          test -n "$TARGET_SIGNING_KEY_ID"
          export TARGET_PRIVATE_KEY_HEX
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/version.json \
            --version "$FULL_VERSION" \
            --commit "${{ github.sha }}" \
            --build-id "${{ github.run_id }}" \
            --artifact-url "$TARGET_ARTIFACT_URL" \
            --published-at "$PUBLISHED_AT" \
            --signing-key-id "$TARGET_SIGNING_KEY_ID" \
            --private-key-env TARGET_PRIVATE_KEY_HEX \
            --expected-public-key-hex "$TARGET_PUBLIC_KEY_HEX"
          python scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "$TARGET_PUBLIC_KEY_HEX" \
            --expected-version "$FULL_VERSION" \
            --expected-commit "${{ github.sha }}" \
            --expected-build-id "${{ github.run_id }}"

      - name: Enforce OTA production release evidence
        env:
          OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
        run: |
          python scripts/ota_contract_gate.py release \
            --evidence ota/release-evidence.json \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "$OTA_SIGNING_PUBLIC_KEY_HEX"

      - name: Deploy to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_TARGET_DIR || '/docker/smart-gatekeeper-ota/' }}
          sftp_only: true
