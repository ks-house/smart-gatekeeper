name: SmartGatekeeper CI/CD Pipeline

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'include/**'
      - 'src/**'
      - 'platformio.ini'
      - 'partitions_*MB_ota.csv'
      - 'ota/**'
      - 'scripts/ota_contract_gate.py'
      - 'tests/test_ota_contract_gate.py'
      - 'tests/test_nas_physical_test_delivery.py'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_target:
        description: Build a canary or request an authorized production release
        required: true
        type: choice
        default: canary
        options:
          - canary
          - physical-test-canary
          - physical-test-connected
          - production

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test and build firmware canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio -r ota/requirements.txt

      - name: Validate OTA P0 contract
        run: |
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create compile-only public canary secrets
        run: cp include/secrets.h.example include/secrets.h

      - name: Build ESP32-C6 firmware public canary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "Building public canary version: ${FULL_VERSION}"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6

      - name: Prepare signed public firmware canary
        run: |
          mkdir -p dist
          cp .pio/build/esp32c6/firmware.bin dist/gatekeeper-firmware.bin
          # Public RFC 8032 test vector seed; never a production credential.
          RFC8032_TEST_SEED_HEX="9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60"
          export RFC8032_TEST_SEED_HEX
          python scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/version.json \
            --version "${{ env.FULL_VERSION }}" \
            --commit "${{ github.sha }}" \
            --build-id "public-canary-${{ github.sha }}" \
            --artifact-url "https://target-canary.invalid/smart-gatekeeper/${{ github.sha }}/firmware.bin" \
            --published-at "2026-08-01T00:00:00Z" \
            --signing-key-id "rfc8032-test-key-1" \
            --private-key-env RFC8032_TEST_SEED_HEX \
            --expected-public-key-hex "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"
          python scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a" \
            --expected-version "${{ env.FULL_VERSION }}" \
            --expected-commit "${{ github.sha }}" \
            --expected-build-id "public-canary-${{ github.sha }}"
          ls -la dist/

      - name: Upload non-secret symbol map for remote crash analysis
        uses: actions/upload-artifact@v4
        with:
          name: target-symbol-map-${{ env.FULL_VERSION }}
          path: .pio/build/esp32c6/firmware.map
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned canary artifacts for physical Gate validation
        uses: actions/upload-artifact@v4
        with:
          name: target-canary
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy_physical_test_canary:
    name: Publish firmware public canary to isolated NAS physical-test storage
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'physical-test-canary' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main physical-test verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact-run firmware canary
        uses: actions/download-artifact@v4
        with:
          name: target-canary
          path: dist

      - name: Set up Python for physical-test verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install physical-test verification dependencies
        run: python -m pip install -r ota/requirements.txt

      - name: Verify exact public firmware canary before NAS contact
        run: |
          python scripts/ota_contract_gate.py physical-test-canary-verify \
            --kind target \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --expected-commit "${{ github.sha }}"

      - name: Install pinned-host SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client sshpass

      - name: Stage, read back, verify and publish isolated firmware canary
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_PORT: ${{ secrets.NAS_PORT || 22 }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in NAS_HOST NAS_USER NAS_PASSWORD NAS_PORT NAS_KNOWN_HOSTS; do
            test -n "${!name}"
          done
          [[ "$NAS_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$NAS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$NAS_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$NAS_PORT >= 1 && 10#$NAS_PORT <= 65535))
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          REMOTE_ROOT="/docker/smart-gatekeeper-physical-test/firmware-public-canary"
          REMOTE_PARENT="${REMOTE_ROOT}/${GITHUB_SHA}"
          REMOTE_STAGE="${REMOTE_PARENT}/.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_FINAL="${REMOTE_PARENT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$REMOTE_ROOT" = "/docker/smart-gatekeeper-physical-test/firmware-public-canary"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/nas_known_hosts"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          test -s "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"
          ssh-keygen -l -E sha256 -f "$KNOWN_HOSTS_FILE" >/dev/null
          HOST_KEY_MODE="repository-secret-pinned"
          export SSHPASS="$NAS_PASSWORD"
          SSH_TARGET="${NAS_USER}@${NAS_HOST}"
          SSH_OPTIONS=(-o BatchMode=no -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}")
          sshpass -e ssh "${SSH_OPTIONS[@]}" -p "$NAS_PORT" "$SSH_TARGET" \
            "umask 077; mkdir -p '$REMOTE_PARENT'; test ! -e '$REMOTE_STAGE'; test ! -e '$REMOTE_FINAL'; mkdir '$REMOTE_STAGE'"
          sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          put dist/gatekeeper-firmware.bin $REMOTE_STAGE/gatekeeper-firmware.bin
          put dist/version.json $REMOTE_STAGE/version.json
          EOF
          mkdir -p readback evidence
          sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          get $REMOTE_STAGE/gatekeeper-firmware.bin readback/gatekeeper-firmware.bin
          get $REMOTE_STAGE/version.json readback/version.json
          EOF
          python scripts/ota_contract_gate.py physical-test-evidence-create \
            --kind target \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --readback-manifest readback/version.json \
            --readback-artifact readback/gatekeeper-firmware.bin \
            --expected-commit "$GITHUB_SHA" \
            --host-key-mode "$HOST_KEY_MODE" \
            --remote-path "$REMOTE_FINAL" \
            --output evidence/firmware-physical-test-evidence.json
          sshpass -e sftp "${SSH_OPTIONS[@]}" -P "$NAS_PORT" -b - "$SSH_TARGET" <<EOF
          put evidence/firmware-physical-test-evidence.json $REMOTE_STAGE/evidence.json
          get $REMOTE_STAGE/evidence.json readback/evidence.json
          EOF
          cmp evidence/firmware-physical-test-evidence.json readback/evidence.json
          sshpass -e ssh "${SSH_OPTIONS[@]}" -p "$NAS_PORT" "$SSH_TARGET" \
            "test -d '$REMOTE_STAGE'; test ! -e '$REMOTE_FINAL'; mv '$REMOTE_STAGE' '$REMOTE_FINAL'"
          unset SSHPASS NAS_PASSWORD NAS_KNOWN_HOSTS

      - name: Upload sanitized firmware physical-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: firmware-physical-test-evidence-${{ github.sha }}
          path: evidence/firmware-physical-test-evidence.json
          if-no-files-found: error
          retention-days: 30

  validate_connected_physical_test_prerequisites:
    name: Fail closed until connected firmware physical-test secrets are provisioned
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'physical-test-connected' &&
      github.ref == 'refs/heads/main'
    environment: physical-test
    runs-on: ubuntu-latest
    steps:
      - name: Validate connected firmware physical-test secret contract
        env:
          PHYSICAL_TEST_ROOT_CA_CERT: ${{ secrets.PHYSICAL_TEST_ROOT_CA_CERT }}
          PHYSICAL_TEST_WIFI_SSID: ${{ secrets.PHYSICAL_TEST_WIFI_SSID }}
          PHYSICAL_TEST_WIFI_PASSWORD: ${{ secrets.PHYSICAL_TEST_WIFI_PASSWORD }}
          PHYSICAL_TEST_API_URL: ${{ secrets.PHYSICAL_TEST_API_URL }}
          PHYSICAL_TEST_API_KEY: ${{ secrets.PHYSICAL_TEST_API_KEY }}
          PHYSICAL_TEST_MQTT_HOST: ${{ secrets.PHYSICAL_TEST_MQTT_HOST }}
          PHYSICAL_TEST_MQTT_PORT: ${{ secrets.PHYSICAL_TEST_MQTT_PORT }}
          PHYSICAL_TEST_MQTT_USER: ${{ secrets.PHYSICAL_TEST_MQTT_USER }}
          PHYSICAL_TEST_MQTT_PASSWORD: ${{ secrets.PHYSICAL_TEST_MQTT_PASSWORD }}
          PHYSICAL_TEST_TARGET_TENANT_ID: ${{ secrets.PHYSICAL_TEST_TARGET_TENANT_ID }}
          PHYSICAL_TEST_TARGET_DOOR_ID: ${{ secrets.PHYSICAL_TEST_TARGET_DOOR_ID }}
          PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID }}
          PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_ACL_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_ACL_SIGNING_KEY_ID }}
          PHYSICAL_TEST_OTA_VERSION_URL: ${{ secrets.PHYSICAL_TEST_OTA_VERSION_URL }}
          PHYSICAL_TEST_OTA_FIRMWARE_URL: ${{ secrets.PHYSICAL_TEST_OTA_FIRMWARE_URL }}
          PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX }}
          PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX }}
          PHYSICAL_TEST_OTA_SIGNING_KEY_ID: ${{ secrets.PHYSICAL_TEST_OTA_SIGNING_KEY_ID }}
          PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD }}
          PHYSICAL_TEST_LOCAL_RECOVERY_USER: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_USER }}
          PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD: ${{ secrets.PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in PHYSICAL_TEST_ROOT_CA_CERT PHYSICAL_TEST_WIFI_SSID \
            PHYSICAL_TEST_WIFI_PASSWORD PHYSICAL_TEST_API_URL PHYSICAL_TEST_API_KEY \
            PHYSICAL_TEST_MQTT_HOST PHYSICAL_TEST_MQTT_PORT PHYSICAL_TEST_MQTT_USER \
            PHYSICAL_TEST_MQTT_PASSWORD PHYSICAL_TEST_TARGET_TENANT_ID \
            PHYSICAL_TEST_TARGET_DOOR_ID PHYSICAL_TEST_COMMAND_SIGNER_PUBLIC_KEY_HEX \
            PHYSICAL_TEST_COMMAND_SIGNING_KEY_ID PHYSICAL_TEST_ACL_SIGNER_PUBLIC_KEY_HEX \
            PHYSICAL_TEST_ACL_SIGNING_KEY_ID PHYSICAL_TEST_OTA_VERSION_URL \
            PHYSICAL_TEST_OTA_FIRMWARE_URL PHYSICAL_TEST_OTA_SIGNING_PRIVATE_KEY_HEX \
            PHYSICAL_TEST_OTA_SIGNING_PUBLIC_KEY_HEX PHYSICAL_TEST_OTA_SIGNING_KEY_ID \
            PHYSICAL_TEST_LOCAL_RECOVERY_AP_PASSWORD PHYSICAL_TEST_LOCAL_RECOVERY_USER \
            PHYSICAL_TEST_LOCAL_RECOVERY_PASSWORD; do
            test -n "${!name}" || missing+=("$name")
          done
          if ((${#missing[@]})); then
            printf 'Missing connected physical-test secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          printf '%s\n' 'Connected signed firmware lane remains disabled until a separately reviewed implementation is authorized.' >&2
          exit 1

  release_to_production:
    name: Validate and deploy firmware to production
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'production' &&
      github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO and OTA release gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio -r ota/requirements.txt

      - name: Verify exact protected main release source
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create production firmware build secrets
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
          SECRET_WIFI_SSID: ${{ secrets.SECRET_WIFI_SSID }}
          SECRET_WIFI_PASSWORD: ${{ secrets.SECRET_WIFI_PASSWORD }}
          SECRET_API_URL: ${{ secrets.SECRET_API_URL }}
          SECRET_API_KEY: ${{ secrets.SECRET_API_KEY }}
          SECRET_MQTT_HOST: ${{ secrets.SECRET_MQTT_HOST }}
          SECRET_MQTT_PORT: ${{ secrets.SECRET_MQTT_PORT }}
          SECRET_MQTT_USER: ${{ secrets.SECRET_MQTT_USER }}
          SECRET_MQTT_PASSWORD: ${{ secrets.SECRET_MQTT_PASSWORD }}
          SECRET_TARGET_TENANT_ID: ${{ secrets.SECRET_TARGET_TENANT_ID }}
          SECRET_TARGET_DOOR_ID: ${{ secrets.SECRET_TARGET_DOOR_ID }}
          SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_COMMAND_SIGNING_KEY_ID: ${{ secrets.SECRET_COMMAND_SIGNING_KEY_ID }}
          SECRET_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_ACL_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_ACL_SIGNING_KEY_ID: ${{ secrets.SECRET_ACL_SIGNING_KEY_ID }}
          SECRET_OTA_VERSION_URL: ${{ secrets.SECRET_OTA_VERSION_URL }}
          SECRET_OTA_FIRMWARE_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          SECRET_OTA_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          SECRET_OTA_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          SECRET_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_AP_PASSWORD }}
          SECRET_LOCAL_RECOVERY_USER: ${{ secrets.SECRET_LOCAL_RECOVERY_USER }}
          SECRET_LOCAL_RECOVERY_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_PASSWORD }}
        run: |
          for name in SECRET_ROOT_CA_CERT SECRET_WIFI_SSID SECRET_WIFI_PASSWORD \
            SECRET_API_URL SECRET_API_KEY SECRET_MQTT_HOST SECRET_MQTT_PORT \
            SECRET_MQTT_USER SECRET_MQTT_PASSWORD SECRET_TARGET_TENANT_ID \
            SECRET_TARGET_DOOR_ID SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX \
            SECRET_COMMAND_SIGNING_KEY_ID SECRET_ACL_SIGNER_PUBLIC_KEY_HEX \
            SECRET_ACL_SIGNING_KEY_ID SECRET_OTA_VERSION_URL \
            SECRET_OTA_FIRMWARE_URL SECRET_OTA_SIGNER_PUBLIC_KEY_HEX \
            SECRET_OTA_SIGNING_KEY_ID SECRET_LOCAL_RECOVERY_AP_PASSWORD \
            SECRET_LOCAL_RECOVERY_USER SECRET_LOCAL_RECOVERY_PASSWORD; do
            test -n "${!name}"
          done
          cat <<EOF > include/secrets.h
          #pragma once
          #define SECRET_WIFI_SSID "${SECRET_WIFI_SSID}"
          #define SECRET_WIFI_PASSWORD "${SECRET_WIFI_PASSWORD}"
          #define SECRET_API_URL "${SECRET_API_URL}"
          #define SECRET_API_KEY "${SECRET_API_KEY}"
          #define SECRET_TEST_BLE_MAC "AA:BB:CC:DD:EE:01"
          #define SECRET_HARDWARELESS_DOOR_ID_HEX ""
          #define SECRET_ACL_SIGNER_PUBLIC_KEY_HEX "${SECRET_ACL_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_ACL_SIGNING_KEY_ID ${SECRET_ACL_SIGNING_KEY_ID}
          #define SECRET_MQTT_HOST "${SECRET_MQTT_HOST}"
          #define SECRET_MQTT_PORT ${SECRET_MQTT_PORT}
          #define SECRET_MQTT_USER "${SECRET_MQTT_USER}"
          #define SECRET_MQTT_PASSWORD "${SECRET_MQTT_PASSWORD}"
          #define SECRET_TARGET_TENANT_ID "${SECRET_TARGET_TENANT_ID}"
          #define SECRET_TARGET_DOOR_ID "${SECRET_TARGET_DOOR_ID}"
          #define SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX "${SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_COMMAND_SIGNING_KEY_ID ${SECRET_COMMAND_SIGNING_KEY_ID}
          #define SECRET_OTA_VERSION_URL "${SECRET_OTA_VERSION_URL}"
          #define SECRET_OTA_FIRMWARE_URL "${SECRET_OTA_FIRMWARE_URL}"
          #define SECRET_APK_VERSION_URL "https://mobile-release.invalid/version.json"
          #define SECRET_APK_DOWNLOAD_URL "https://mobile-release.invalid/app.apk"
          #define SECRET_OTA_SIGNER_PUBLIC_KEY_HEX "${SECRET_OTA_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_OTA_SIGNING_KEY_ID "${SECRET_OTA_SIGNING_KEY_ID}"
          #define SECRET_LOCAL_RECOVERY_AP_PASSWORD "${SECRET_LOCAL_RECOVERY_AP_PASSWORD}"
          #define SECRET_LOCAL_RECOVERY_USER "${SECRET_LOCAL_RECOVERY_USER}"
          #define SECRET_LOCAL_RECOVERY_PASSWORD "${SECRET_LOCAL_RECOVERY_PASSWORD}"
          EOF
          printf '#define SECRET_ROOT_CA_CERT R"(\n%s\n)"\n' "$SECRET_ROOT_CA_CERT" >> include/secrets.h

      - name: Build exact production firmware
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6
          mkdir -p dist
          cp .pio/build/esp32c6/firmware.bin dist/gatekeeper-firmware.bin
          test -s dist/gatekeeper-firmware.bin

      - name: Create production signed Target manifest
        env:
          TARGET_ARTIFACT_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          TARGET_PRIVATE_KEY_HEX: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_HEX }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          TARGET_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
        run: |
          test -n "$TARGET_ARTIFACT_URL"
          test -n "$TARGET_PRIVATE_KEY_HEX"
          test -n "$TARGET_PUBLIC_KEY_HEX"
          test -n "$TARGET_SIGNING_KEY_ID"
          export TARGET_PRIVATE_KEY_HEX
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/version.json \
            --version "$FULL_VERSION" \
            --commit "${{ github.sha }}" \
            --build-id "${{ github.run_id }}" \
            --artifact-url "$TARGET_ARTIFACT_URL" \
            --published-at "$PUBLISHED_AT" \
            --signing-key-id "$TARGET_SIGNING_KEY_ID" \
            --private-key-env TARGET_PRIVATE_KEY_HEX \
            --expected-public-key-hex "$TARGET_PUBLIC_KEY_HEX"
          python scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "$TARGET_PUBLIC_KEY_HEX" \
            --expected-version "$FULL_VERSION" \
            --expected-commit "${{ github.sha }}" \
            --expected-build-id "${{ github.run_id }}"

      - name: Enforce OTA production release evidence
        env:
          OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
        run: |
          python scripts/ota_contract_gate.py release \
            --evidence ota/release-evidence.json \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "$OTA_SIGNING_PUBLIC_KEY_HEX"

      - name: Deploy to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_TARGET_DIR || '/docker/smart-gatekeeper-ota/' }}
          sftp_only: true
