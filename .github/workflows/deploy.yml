name: SmartGatekeeper CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: ESP32-C6 펌웨어 빌드 및 NAS SFTP 배포 (기존 유지)
  # ─────────────────────────────────────────────────────────────────
  firmware_build_and_deploy:
    name: 🔧 Firmware Build & OTA Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Create secrets.h from GitHub Secrets
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
        run: |
          cat <<'HEREDOC' > include/secrets.h
          #ifndef SECRETS_H
          #define SECRETS_H
          HEREDOC

          cat <<EOF >> include/secrets.h
          #define SECRET_WIFI_SSID "${{ secrets.SECRET_WIFI_SSID }}"
          #define SECRET_WIFI_PASSWORD "${{ secrets.SECRET_WIFI_PASSWORD }}"
          #define SECRET_API_URL "${{ secrets.SECRET_API_URL }}"
          #define SECRET_API_KEY "${{ secrets.SECRET_API_KEY }}"
          #define SECRET_MQTT_HOST "${{ secrets.SECRET_MQTT_HOST }}"
          #define SECRET_MQTT_PORT ${{ secrets.SECRET_MQTT_PORT || '4883' }}
          #define SECRET_MQTT_USER "${{ secrets.SECRET_MQTT_USER }}"
          #define SECRET_MQTT_PASSWORD "${{ secrets.SECRET_MQTT_PASSWORD }}"
          #define SECRET_OTA_VERSION_URL "${{ secrets.SECRET_OTA_VERSION_URL }}"
          #define SECRET_OTA_FIRMWARE_URL "${{ secrets.SECRET_OTA_FIRMWARE_URL }}"
          EOF

          # Append multi-line Root CA cert using Raw String Literal
          printf '#define SECRET_ROOT_CA_CERT R\"(\n%s\n)\"\n' "${SECRET_ROOT_CA_CERT}" >> include/secrets.h

          echo '#endif // SECRETS_H' >> include/secrets.h
          echo "[CI] include/secrets.h generated successfully."

      - name: Build ESP32-C6 Firmware with Version Override
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.0.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Building version: ${FULL_VERSION}"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6

      - name: Prepare Deployment Artifacts (firmware.bin & version.json)
        run: |
          mkdir -p dist
          cp .pio/build/esp32c6/firmware.bin dist/gatekeeper-firmware.bin

          cat <<EOF > dist/version.json
          {
            "version": "${{ env.FULL_VERSION }}",
            "build_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "firmware_url": "${{ secrets.SECRET_OTA_FIRMWARE_URL }}"
          }
          EOF

          ls -la dist/

      - name: Deploy Firmware to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_TARGET_DIR || '/volume1/docker/smart-gatekeeper-ota/' }}
          sftp_only: true

  # ─────────────────────────────────────────────────────────────────
  # Job 2: 백엔드 변경 감지 → 시놀로지 NAS SSH 자동 재배포 (v2.0 신규)
  # 조건: backend/ 디렉토리 하위 파일이 변경된 경우에만 실행
  # ─────────────────────────────────────────────────────────────────
  backend_deploy:
    name: 🐍 Backend Deploy to Synology NAS (SSH)
    runs-on: ubuntu-latest
    # backend/ 경로 변경 시에만 실행 (펌웨어 전용 커밋에서는 건너뜀)
    if: |
      contains(join(github.event.commits.*.modified, ' '), 'backend/') ||
      contains(join(github.event.commits.*.added, ' '), 'backend/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAS_SSH_KEY }}

      - name: Add NAS Host to known_hosts (지문 검증 우회 방지)
        run: |
          mkdir -p ~/.ssh
          # NAS의 SSH 호스트 공개키를 known_hosts에 추가
          ssh-keyscan -p ${{ secrets.NAS_PORT || 22 }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "[CI] known_hosts 등록 완료"

      - name: Deploy backend via SSH to Synology NAS Container Manager
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PORT: ${{ secrets.NAS_PORT || 22 }}
          # NAS 상의 backend docker-compose.yml 위치 (Container Manager 프로젝트 경로)
          # 예: /volume1/docker/smart-gatekeeper/backend
          NAS_BACKEND_DIR: ${{ secrets.NAS_BACKEND_DIR }}
          # .env 파일의 NAS 상 경로 (민감정보를 직접 전달하지 않고 파일로 관리)
          NAS_ENV_FILE: ${{ secrets.NAS_ENV_FILE || '' }}
        run: |
          ssh -p ${NAS_PORT} ${NAS_USER}@${NAS_HOST} << 'ENDSSH'
            set -e
            echo "=== [NAS] 백엔드 자동 배포 시작 ==="
            echo "배포 경로: ${NAS_BACKEND_DIR:-/volume1/docker/smart-gatekeeper/backend}"
            BACKEND_DIR="${NAS_BACKEND_DIR:-/volume1/docker/smart-gatekeeper/backend}"

            # 1. 최신 소스 pull (NAS에 git 클론이 되어있는 경우)
            if [ -d "${BACKEND_DIR}/.git" ]; then
              cd "${BACKEND_DIR}"
              git pull origin main
              echo "[CI] git pull 완료"
            else
              echo "[CI] WARNING: ${BACKEND_DIR}는 git 저장소가 아닙니다. SFTP 방식 또는 git clone 필요."
            fi

            # 2. docker compose 재빌드 및 재시작
            cd "${BACKEND_DIR}"
            docker compose pull 2>/dev/null || true
            docker compose up -d --build --remove-orphans
            echo "[CI] docker compose up 완료"

            # 3. 컨테이너 상태 확인
            echo "=== 컨테이너 상태 ==="
            docker compose ps
            echo "=== [NAS] 배포 완료 ==="
          ENDSSH

      - name: Verify backend health check
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          # 컨테이너 기동 대기 (최대 30초)
          echo "[CI] 백엔드 헬스 체크 대기 중..."
          sleep 10
          HEALTH_URL="${BACKEND_HEALTH_URL:-https://${NAS_HOST}:4443/health}"
          for i in $(seq 1 6); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            echo "[CI] 헬스 체크 시도 ${i}/6 → HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "[CI] ✅ 백엔드 정상 응답 확인!"
              break
            fi
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "[CI] ⚠️ 헬스 체크 최종 실패 (HTTP ${STATUS}) — 수동 확인 필요"
            exit 1
          fi
