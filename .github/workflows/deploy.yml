name: SmartGatekeeper CI/CD Pipeline

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'include/**'
      - 'src/**'
      - 'platformio.ini'
      - 'partitions_*MB_ota.csv'
      - 'ota/**'
      - 'scripts/ota_contract_gate.py'
      - 'tests/test_ota_contract_gate.py'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_target:
        description: Build a canary or request an authorized production release
        required: true
        type: choice
        default: canary
        options:
          - canary
          - production

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test and build firmware canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio -r ota/requirements.txt

      - name: Validate OTA P0 contract
        run: |
          python scripts/ota_contract_gate.py contract
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create secrets.h from GitHub Secrets
        if: github.event_name != 'pull_request'
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
        run: |
          cat <<'HEREDOC' > include/secrets.h
          #ifndef SECRETS_H
          #define SECRETS_H
          HEREDOC

          cat <<EOF >> include/secrets.h
          #define SECRET_WIFI_SSID "${{ secrets.SECRET_WIFI_SSID }}"
          #define SECRET_WIFI_PASSWORD "${{ secrets.SECRET_WIFI_PASSWORD }}"
          #define SECRET_API_URL "${{ secrets.SECRET_API_URL }}"
          #define SECRET_API_KEY "${{ secrets.SECRET_API_KEY }}"
          #define SECRET_MQTT_HOST "${{ secrets.SECRET_MQTT_HOST }}"
          #define SECRET_MQTT_PORT ${{ secrets.SECRET_MQTT_PORT || '4883' }}
          #define SECRET_MQTT_USER "${{ secrets.SECRET_MQTT_USER }}"
          #define SECRET_MQTT_PASSWORD "${{ secrets.SECRET_MQTT_PASSWORD }}"
          #define SECRET_OTA_VERSION_URL "${{ secrets.SECRET_OTA_VERSION_URL }}"
          #define SECRET_OTA_FIRMWARE_URL "${{ secrets.SECRET_OTA_FIRMWARE_URL }}"
          #define SECRET_APK_VERSION_URL "${{ secrets.SECRET_APK_VERSION_URL }}"
          #define SECRET_APK_DOWNLOAD_URL "${{ secrets.SECRET_APK_DOWNLOAD_URL }}"
          EOF


          # Append multi-line Root CA cert using Raw String Literal
          printf '#define SECRET_ROOT_CA_CERT R\"(\n%s\n)\"\n' "${SECRET_ROOT_CA_CERT}" >> include/secrets.h

          echo '#endif // SECRETS_H' >> include/secrets.h
          echo "[CI] include/secrets.h generated successfully."

      - name: Create compile-only secrets.h for pull requests
        if: github.event_name == 'pull_request'
        run: cp include/secrets.h.example include/secrets.h

      - name: Build ESP32-C6 Firmware with Version Override
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Building version: ${FULL_VERSION}"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6

      - name: Prepare Deployment Artifacts (firmware.bin & version.json)
        run: |
          mkdir -p dist
          cp .pio/build/esp32c6/firmware.bin dist/gatekeeper-firmware.bin

          cat <<EOF > dist/version.json
          {
            "version": "${{ env.FULL_VERSION }}",
            "build_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "firmware_url": "${{ secrets.SECRET_OTA_FIRMWARE_URL }}"
          }
          EOF

          ls -la dist/

      - name: Upload non-secret symbol map for remote crash analysis
        uses: actions/upload-artifact@v4
        with:
          name: target-symbol-map-${{ env.FULL_VERSION }}
          path: .pio/build/esp32c6/firmware.map
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned canary artifacts for physical Gate validation
        uses: actions/upload-artifact@v4
        with:
          name: target-canary
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release_to_production:
    name: Validate and deploy firmware to production
    needs: test_and_build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_target == 'production'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OTA release gate dependencies
        run: python -m pip install -r ota/requirements.txt

      - name: Download the exact canary selected for production
        uses: actions/download-artifact@v4
        with:
          name: target-canary
          path: dist

      - name: Enforce OTA production release evidence
        env:
          OTA_SIGNING_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
        run: |
          python scripts/ota_contract_gate.py release \
            --evidence ota/release-evidence.json \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.bin \
            --public-key-hex "$OTA_SIGNING_PUBLIC_KEY_HEX"

      - name: Deploy to Synology NAS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.NAS_TARGET_DIR || '/docker/smart-gatekeeper-ota/' }}

          sftp_only: true
