name: OTA P0 Contract Gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'gatekeeper_app/**'
      - 'include/**'
      - 'ota/**'
      - 'partitions_*MB_ota.csv'
      - 'scripts/ota_contract_gate.py'
      - 'src/**'
      - 'tests/test_ota_contract_gate.py'
      - 'wiki/ota_reliability_contract.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'gatekeeper_app/**'
      - 'include/**'
      - 'ota/**'
      - 'partitions_*MB_ota.csv'
      - 'scripts/ota_contract_gate.py'
      - 'src/**'
      - 'tests/test_ota_contract_gate.py'
      - 'wiki/ota_reliability_contract.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Schemas, signatures, recovery and blocker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ota/requirements.txt
      - name: Install OTA gate dependencies
        run: pip install -r ota/requirements.txt
      - name: Validate OTA contract assets
        run: python scripts/ota_contract_gate.py contract
      - name: Run OTA contract fault tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
