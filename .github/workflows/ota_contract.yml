name: OTA P0 Contract Gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'gatekeeper_app/**'
      - 'include/**'
      - 'ota/**'
      - 'partitions_*MB_ota.csv'
      - 'scripts/ota_contract_gate.py'
      - 'src/**'
      - 'tests/test_ota_contract_gate.py'
      - 'wiki/ota_reliability_contract.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'gatekeeper_app/**'
      - 'include/**'
      - 'ota/**'
      - 'partitions_*MB_ota.csv'
      - 'scripts/ota_contract_gate.py'
      - 'src/**'
      - 'tests/test_ota_contract_gate.py'
      - 'wiki/ota_reliability_contract.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Schemas, signatures, recovery and blocker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: ota/requirements.lock
      - name: Install OTA gate dependencies
        run: python -m pip install --require-hashes -r ota/requirements.lock
      - name: Validate OTA contract assets
        run: python scripts/ota_contract_gate.py contract
      - name: Run OTA contract fault tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
