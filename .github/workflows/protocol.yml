name: Security protocol vectors

on:
  pull_request:
    paths:
      - "protocol/**"
      - "wiki/security_protocol.md"
      - ".github/workflows/protocol.yml"
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - "wiki/security_protocol.md"
      - ".github/workflows/protocol.yml"

permissions:
  contents: read

jobs:
  canonical-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Verify committed canonical bytes and signatures
        run: python protocol/tools/verify_vectors.py
      - name: Run replay, mutation, framing, and compatibility tests
        run: python -m unittest discover -s protocol/tests -v
