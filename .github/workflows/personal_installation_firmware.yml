name: Personal installation firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build encrypted production-secret firmware
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.20'

      - name: Install build and OTA dependencies
        run: |
          python -m pip install --require-hashes -r ota/requirements.lock

      - name: Verify connectivity and OTA contracts before secrets
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ota_contract_gate.py contract
          python -m unittest \
            tests.test_connectivity_recovery_contract \
            tests.test_personal_installation_workflow -v

      - name: Create actual personal-installation secrets
        env:
          SECRET_ROOT_CA_CERT: ${{ secrets.SECRET_ROOT_CA_CERT }}
          SECRET_WIFI_SSID: ${{ secrets.SECRET_WIFI_SSID }}
          SECRET_WIFI_PASSWORD: ${{ secrets.SECRET_WIFI_PASSWORD }}
          SECRET_API_URL: ${{ secrets.SECRET_API_URL }}
          SECRET_API_KEY: ${{ secrets.SECRET_API_KEY }}
          SECRET_MQTT_HOST: ${{ secrets.SECRET_MQTT_HOST }}
          SECRET_MQTT_PORT: ${{ secrets.SECRET_MQTT_PORT }}
          SECRET_MQTT_USER: ${{ secrets.SECRET_MQTT_USER }}
          SECRET_MQTT_PASSWORD: ${{ secrets.SECRET_MQTT_PASSWORD }}
          SECRET_TARGET_TENANT_ID: ${{ secrets.SECRET_TARGET_TENANT_ID }}
          SECRET_TARGET_DOOR_ID: ${{ secrets.SECRET_TARGET_DOOR_ID }}
          SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_COMMAND_SIGNING_KEY_ID: ${{ secrets.SECRET_COMMAND_SIGNING_KEY_ID }}
          SECRET_HARDWARELESS_DOOR_ID_HEX: ${{ secrets.SECRET_HARDWARELESS_DOOR_ID_HEX }}
          SECRET_ACL_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.SECRET_ACL_SIGNER_PUBLIC_KEY_HEX }}
          SECRET_ACL_SIGNING_KEY_ID: ${{ secrets.SECRET_ACL_SIGNING_KEY_ID }}
          SECRET_OTA_VERSION_URL: ${{ secrets.SECRET_OTA_VERSION_URL }}
          SECRET_OTA_FIRMWARE_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          SECRET_OTA_SIGNER_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          SECRET_OTA_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          SECRET_OTA_CONTENT_KEY_HEX: ${{ secrets.SECRET_OTA_CONTENT_KEY_HEX }}
          SECRET_OTA_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
          SECRET_LOCAL_RECOVERY_AP_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_AP_PASSWORD }}
          SECRET_LOCAL_RECOVERY_USER: ${{ secrets.SECRET_LOCAL_RECOVERY_USER }}
          SECRET_LOCAL_RECOVERY_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          fail_secret_contract() {
            printf '::error::Production secret contract failed: %s\n' "$1" >&2
            exit 1
          }
          for name in SECRET_ROOT_CA_CERT SECRET_WIFI_SSID SECRET_WIFI_PASSWORD \
            SECRET_API_URL SECRET_API_KEY SECRET_MQTT_HOST SECRET_MQTT_PORT \
            SECRET_MQTT_USER SECRET_MQTT_PASSWORD SECRET_TARGET_TENANT_ID \
            SECRET_TARGET_DOOR_ID SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX \
            SECRET_COMMAND_SIGNING_KEY_ID SECRET_HARDWARELESS_DOOR_ID_HEX \
            SECRET_ACL_SIGNER_PUBLIC_KEY_HEX SECRET_ACL_SIGNING_KEY_ID \
            SECRET_OTA_VERSION_URL \
            SECRET_OTA_FIRMWARE_URL SECRET_OTA_SIGNER_PUBLIC_KEY_HEX \
            SECRET_OTA_SIGNING_KEY_ID SECRET_OTA_CONTENT_KEY_HEX \
            SECRET_OTA_CONTENT_KEY_ID SECRET_LOCAL_RECOVERY_AP_PASSWORD \
            SECRET_LOCAL_RECOVERY_USER SECRET_LOCAL_RECOVERY_PASSWORD; do
            test -n "${!name}" || fail_secret_contract "$name is empty"
          done
          test "$SECRET_WIFI_SSID" != "YOUR_WIFI_SSID" || fail_secret_contract "SECRET_WIFI_SSID is placeholder"
          test "$SECRET_WIFI_PASSWORD" != "YOUR_WIFI_PASSWORD" || fail_secret_contract "SECRET_WIFI_PASSWORD is placeholder"
          [[ "$SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX" =~ ^04[0-9a-f]{128}$ ]] || fail_secret_contract "SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX format"
          [[ "$SECRET_HARDWARELESS_DOOR_ID_HEX" =~ ^[0-9a-f]{32}$ ]] || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX format"
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "00000000000000000000000000000000" || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX all-zero"
          test "$SECRET_HARDWARELESS_DOOR_ID_HEX" != "ffffffffffffffffffffffffffffffff" || fail_secret_contract "SECRET_HARDWARELESS_DOOR_ID_HEX all-FF"
          [[ "$SECRET_ACL_SIGNER_PUBLIC_KEY_HEX" =~ ^04[0-9a-f]{128}$ ]] || fail_secret_contract "SECRET_ACL_SIGNER_PUBLIC_KEY_HEX format"
          [[ "$SECRET_ACL_SIGNING_KEY_ID" =~ ^[1-9][0-9]{0,9}$ ]] || fail_secret_contract "SECRET_ACL_SIGNING_KEY_ID format"
          ((10#$SECRET_ACL_SIGNING_KEY_ID <= 4294967295)) || fail_secret_contract "SECRET_ACL_SIGNING_KEY_ID range"
          [[ "$SECRET_OTA_SIGNER_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]] || fail_secret_contract "OTA_SIGNING_PUBLIC_KEY_HEX format"
          [[ "$SECRET_OTA_CONTENT_KEY_HEX" =~ ^[0-9a-f]{64}$ ]] || fail_secret_contract "SECRET_OTA_CONTENT_KEY_HEX format"
          test "$SECRET_OTA_CONTENT_KEY_ID" = "personal-target-content-20260824-1" || fail_secret_contract "SECRET_OTA_CONTENT_KEY_ID identity"
          test "${#SECRET_LOCAL_RECOVERY_AP_PASSWORD}" -ge 16 || fail_secret_contract "SECRET_LOCAL_RECOVERY_AP_PASSWORD length"
          test "${#SECRET_LOCAL_RECOVERY_USER}" -ge 8 || fail_secret_contract "SECRET_LOCAL_RECOVERY_USER length"
          test "${#SECRET_LOCAL_RECOVERY_PASSWORD}" -ge 16 || fail_secret_contract "SECRET_LOCAL_RECOVERY_PASSWORD length"
          cat <<EOF > include/secrets.h
          #pragma once
          #define SECRET_WIFI_SSID "${SECRET_WIFI_SSID}"
          #define SECRET_WIFI_PASSWORD "${SECRET_WIFI_PASSWORD}"
          #define SECRET_API_URL "${SECRET_API_URL}"
          #define SECRET_API_KEY "${SECRET_API_KEY}"
          #define SECRET_TEST_BLE_MAC "AA:BB:CC:DD:EE:01"
          #define SECRET_HARDWARELESS_DOOR_ID_HEX "${SECRET_HARDWARELESS_DOOR_ID_HEX}"
          #define SECRET_ACL_SIGNER_PUBLIC_KEY_HEX "${SECRET_ACL_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_ACL_SIGNING_KEY_ID ${SECRET_ACL_SIGNING_KEY_ID}
          #define SECRET_MQTT_HOST "${SECRET_MQTT_HOST}"
          #define SECRET_MQTT_PORT ${SECRET_MQTT_PORT}
          #define SECRET_MQTT_USER "${SECRET_MQTT_USER}"
          #define SECRET_MQTT_PASSWORD "${SECRET_MQTT_PASSWORD}"
          #define SECRET_TARGET_TENANT_ID "${SECRET_TARGET_TENANT_ID}"
          #define SECRET_TARGET_DOOR_ID "${SECRET_TARGET_DOOR_ID}"
          #define SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX "${SECRET_COMMAND_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_COMMAND_SIGNING_KEY_ID ${SECRET_COMMAND_SIGNING_KEY_ID}
          #define SECRET_OTA_VERSION_URL "${SECRET_OTA_VERSION_URL}"
          #define SECRET_OTA_FIRMWARE_URL "${SECRET_OTA_FIRMWARE_URL}"
          #define SECRET_APK_VERSION_URL "https://mobile-release.invalid/version.json"
          #define SECRET_APK_DOWNLOAD_URL "https://mobile-release.invalid/app.apk"
          #define SECRET_OTA_SIGNER_PUBLIC_KEY_HEX "${SECRET_OTA_SIGNER_PUBLIC_KEY_HEX}"
          #define SECRET_OTA_SIGNING_KEY_ID "${SECRET_OTA_SIGNING_KEY_ID}"
          #define SECRET_OTA_CONTENT_KEY_HEX "${SECRET_OTA_CONTENT_KEY_HEX}"
          #define SECRET_OTA_CONTENT_KEY_ID "${SECRET_OTA_CONTENT_KEY_ID}"
          #define SECRET_LOCAL_RECOVERY_AP_PASSWORD "${SECRET_LOCAL_RECOVERY_AP_PASSWORD}"
          #define SECRET_LOCAL_RECOVERY_USER "${SECRET_LOCAL_RECOVERY_USER}"
          #define SECRET_LOCAL_RECOVERY_PASSWORD "${SECRET_LOCAL_RECOVERY_PASSWORD}"
          EOF
          printf '#define SECRET_ROOT_CA_CERT R"(\n%s\n)"\n' "$SECRET_ROOT_CA_CERT" >> include/secrets.h

      - name: Build exact ESP32-C6 installation images
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="2.1.0-g${SHORT_SHA}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION_OVERRIDE=\\\"${FULL_VERSION}\\\""
          pio run -e esp32c6_personal_production
          python scripts/verify_target_flash_layout.py \
            --partitions partitions_16MB_ota.csv \
            --firmware .pio/build/esp32c6_personal_production/firmware.bin \
            --flash-size 0x1000000 \
            --max-slot-usage-percent 80
          mkdir -p dist
          cp .pio/build/esp32c6_personal_production/firmware.bin dist/gatekeeper-firmware.bin
          cp .pio/build/esp32c6_personal_production/firmware.factory.bin dist/firmware.factory.bin
          cp .pio/build/esp32c6_personal_production/bootloader.bin dist/bootloader.bin
          cp .pio/build/esp32c6_personal_production/partitions.bin dist/partitions.bin
          cp include/secrets.h dist/provisioned-secrets.h
          BOOT_APP0=$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -type f -print -quit)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/boot_app0.bin
          cat > dist/flash-layout.txt <<'EOF'
          NVS-preserving USB write (do not run erase_flash):
            Target profile: ESP32-C6-WROOM-1-N16 16MB dual OTA
            0x0000 bootloader.bin
            0x8000 partitions.bin
            0xe000 boot_app0.bin
            0x10000 gatekeeper-firmware.bin

          firmware.factory.bin is full recovery only. Writing it at 0x0 can
          erase NVS/Wi-Fi credentials because it contains padded gaps.
          EOF
          (cd dist && sha256sum bootloader.bin partitions.bin boot_app0.bin \
            gatekeeper-firmware.bin firmware.factory.bin provisioned-secrets.h > SHA256SUMS)

      - name: Create and verify production-signed OTA manifest
        env:
          TARGET_ARTIFACT_URL: ${{ secrets.SECRET_OTA_FIRMWARE_URL }}
          TARGET_PRIVATE_KEY_HEX: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_HEX }}
          TARGET_PUBLIC_KEY_HEX: ${{ secrets.OTA_SIGNING_PUBLIC_KEY_HEX }}
          TARGET_SIGNING_KEY_ID: ${{ secrets.OTA_SIGNING_KEY_ID }}
          TARGET_CONTENT_KEY_HEX: ${{ secrets.SECRET_OTA_CONTENT_KEY_HEX }}
          TARGET_CONTENT_KEY_ID: ${{ secrets.SECRET_OTA_CONTENT_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$TARGET_ARTIFACT_URL"
          test -n "$TARGET_PRIVATE_KEY_HEX"
          test -n "$TARGET_PUBLIC_KEY_HEX"
          test -n "$TARGET_SIGNING_KEY_ID"
          [[ "$TARGET_CONTENT_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          test "$TARGET_CONTENT_KEY_ID" = "personal-target-content-20260824-1"
          IMMUTABLE_ARTIFACT_URL="${TARGET_ARTIFACT_URL%/*}/gatekeeper-firmware-${GITHUB_SHA}.sgkenc"
          ROUNDTRIP="${RUNNER_TEMP}/gatekeeper-firmware-roundtrip.bin"
          export TARGET_PRIVATE_KEY_HEX
          export TARGET_CONTENT_KEY_HEX
          trap 'rm -f "$ROUNDTRIP"' EXIT
          python -I scripts/ota_contract_gate.py target-content-encrypt \
            --artifact dist/gatekeeper-firmware.bin \
            --output dist/gatekeeper-firmware.sgkenc \
            --key-env TARGET_CONTENT_KEY_HEX \
            --key-id "$TARGET_CONTENT_KEY_ID" \
            --commit "$GITHUB_SHA"
          python -I scripts/ota_contract_gate.py target-content-decrypt \
            --input dist/gatekeeper-firmware.sgkenc \
            --output "$ROUNDTRIP" \
            --key-env TARGET_CONTENT_KEY_HEX \
            --key-id "$TARGET_CONTENT_KEY_ID" \
            --commit "$GITHUB_SHA"
          cmp dist/gatekeeper-firmware.bin "$ROUNDTRIP"
          rm -f "$ROUNDTRIP"
          trap - EXIT
          PUBLISHED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          python scripts/ota_contract_gate.py target-manifest-create \
            --artifact dist/gatekeeper-firmware.sgkenc \
            --plaintext-artifact dist/gatekeeper-firmware.bin \
            --encryption-key-id "$TARGET_CONTENT_KEY_ID" \
            --output dist/version.json \
            --version "$FULL_VERSION" \
            --commit "$GITHUB_SHA" \
            --build-id "$GITHUB_RUN_ID" \
            --artifact-url "$IMMUTABLE_ARTIFACT_URL" \
            --published-at "$PUBLISHED_AT" \
            --signing-key-id "$TARGET_SIGNING_KEY_ID" \
            --private-key-env TARGET_PRIVATE_KEY_HEX \
            --expected-public-key-hex "$TARGET_PUBLIC_KEY_HEX"
          python scripts/ota_contract_gate.py target-manifest-verify \
            --manifest dist/version.json \
            --artifact dist/gatekeeper-firmware.sgkenc \
            --public-key-hex "$TARGET_PUBLIC_KEY_HEX" \
            --expected-version "$FULL_VERSION" \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-id "$GITHUB_RUN_ID" \
            --expected-encryption-key-id "$TARGET_CONTENT_KEY_ID"
          (cd dist && sha256sum gatekeeper-firmware.sgkenc version.json >> SHA256SUMS)

      - name: Encrypt installation bundle
        env:
          INSTALL_BUNDLE_PASSWORD: ${{ secrets.SECRET_LOCAL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          command -v 7z
          test "${#INSTALL_BUNDLE_PASSWORD}" -ge 16
          mkdir -p delivery
          7z a -t7z -mhe=on -p"$INSTALL_BUNDLE_PASSWORD" \
            "delivery/target-personal-installation-${GITHUB_SHA}.7z" ./dist/*
          test -s "delivery/target-personal-installation-${GITHUB_SHA}.7z"

      - name: Upload encrypted one-day bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-personal-installation-${{ github.sha }}
          path: delivery/*.7z
          if-no-files-found: error
          retention-days: 1
