; ============================================================
; smart-gatekeeper — PlatformIO Project Configuration
; MCU: ESP32-C6-DevKitC-1 N16 (RISC-V, 16MB Flash, Wi-Fi 6, BLE 5.3)
; Framework: Arduino via pioarduino (공식 espressif32는 C6 미지원)
; Step 4: BLE 5.0 + ToF 이중 검증 (Walk-through) 펌웨어
; ============================================================
; ⚠️ 출처: raw/Espressif_ESP32C6_BoardSpec.md & AGENTS.md §4.4
; ============================================================

[platformio]
default_envs = esp32c6

; ─────────────────────────────────────────────────────────────
; 공통 설정 (모든 env가 상속)
; ─────────────────────────────────────────────────────────────
[common]
platform               = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board                  = esp32-c6-devkitc-1
framework              = arduino
monitor_speed          = 115200
board_build.partitions = partitions_16MB_ota.csv ; 16MB N16 Flash Dual-OTA 파티션 (App 영역 각 7.0MB 확보)
build_flags            =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    ; ESP32-C6 Native USB CDC 활성화 (없으면 시리얼 모니터 안 열림)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; NimBLE Host 태스크 스택 크기 확대 (기본 4096 → 8192)
    ; BLE Active Scan 콜백(onResult) 내 UUID 비교 + 문자열 처리 시 스택 오버플로우 방지
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=8192
lib_deps               =
    pololu/VL53L0X @ ^1.3.1
    bblanchon/ArduinoJson @ ^6.21.5
    knolleary/PubSubClient @ ^2.8
lib_ldf_mode = chain ; 미사용 라이브러리 깊은 스캔을 줄여 빌드 판단 속도 향상
; ─────────────────────────────────────────────────────────────
; 기본 환경 (통합 빌드)
; ─────────────────────────────────────────────────────────────
[env:esp32c6]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
monitor_speed          = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags            = ${common.build_flags}
lib_deps               = ${common.lib_deps}
