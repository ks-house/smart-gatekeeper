; ============================================================
; smart-gatekeeper — PlatformIO Project Configuration
; MCU: ESP32-C6-DevKitC-1 with ESP32-C6-WROOM-1-N16 (RISC-V, 16MB Flash, Wi-Fi 6, BLE 5.3)
; Framework: Arduino via pioarduino (공식 espressif32는 C6 미지원)
; v2.0: BLE Beacon Advertiser + MQTT Pre-arm 아키텍처
; ============================================================
; ⚠️ 출처: raw/Espressif_ESP32C6_BoardSpec.md & AGENTS.md §4.4
; ============================================================

[platformio]
default_envs = esp32c6

; ─────────────────────────────────────────────────────────────
; 공통 설정 (모든 env가 상속)
; ─────────────────────────────────────────────────────────────
[common]
; Exact pioarduino 55.03.39 commit (Arduino 3.3.9). Never use the mutable stable URL.
platform               = https://github.com/pioarduino/platform-espressif32.git#cbc3349061987c28bc1b48d43d473e70c5ae04ed
board                  = esp32-c6-devkitc-1
framework              = arduino
monitor_speed          = 115200
board_build.partitions = partitions_16MB_ota.csv ; 16MB N16 Flash Dual-OTA 파티션 (App 영역 각 7.0MB 확보)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags            =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Iinclude
    -DENABLE_HARDWARELESS_RC=0
    -DSGK_PRODUCTION_BUILD=0
    ; MQTTS command-verifier initialization exceeds the Arduino core's default
    ; 8KB loopTask stack on the physical ESP32-C6 Target.
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; ESP32-C6 Native USB CDC 활성화 (없으면 시리얼 모니터 안 열림)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; ⚠️ issue.md P2-13b — 아래 lib_deps 주석은 "내장 Bluedroid" 라고 하지만,
    ;    src/main.cpp 의 getNative()->u128.value 는 NimBLE 타입 필드다.
    ;    실제로 링크되는 스택을 확인한 뒤 여기에 명시적으로 고정할 것.
    ;    (프레임워크 업그레이드만으로 iBeacon UUID 바이트 순서가 조용히
    ;     뒤집힐 수 있다. 그러면 앱이 비콘을 전혀 인식하지 못한다.)
    ;    Tx Power 는 코드에서 BLEDevice::setPower() 로 설정한다 —
    ;    여기에 관련 빌드 플래그는 없다.
lib_deps               =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8
    ; v2.0: Arduino-ESP32 내장 BLEDevice (Bluedroid) 사용 — Advertiser 모드
    ; 추가 라이브러리 불필요 (pioarduino IDF5.x 완전 호환)

lib_ldf_mode = chain ; 미사용 라이브러리 깊은 스캔을 줄여 빌드 판단 속도 향상
; ─────────────────────────────────────────────────────────────
; 기본 환경 (통합 빌드)
; ─────────────────────────────────────────────────────────────
[env:esp32c6]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
monitor_speed          = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
build_flags            = ${common.build_flags}
lib_deps               = ${common.lib_deps}


; Production installation build. Keep this separate from the default developer
; environment so SGK_PRODUCTION_BUILD has exactly one effective definition.
[env:esp32c6_production]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
monitor_speed          = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
build_unflags          = -DSGK_PRODUCTION_BUILD=0
build_flags            =
    ${common.build_flags}
    -DSGK_PRODUCTION_BUILD=1
lib_deps               = ${common.lib_deps}


; Personal installation production build. Unlike the commercial production
; profile, this image includes Hardwareless GATT and requests it on at boot.
; Door identity and ACL trust still come only from secrets.h or provisioned NVS.
[env:esp32c6_personal_production]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
monitor_speed          = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
build_unflags          =
    -DSGK_PRODUCTION_BUILD=0
    -DENABLE_HARDWARELESS_RC=0
build_flags            =
    ${common.build_flags}
    -DSGK_PRODUCTION_BUILD=1
    -DSGK_PERSONAL_INSTALLATION_BUILD=1
    -DENABLE_HARDWARELESS_RC=1
lib_deps               = ${common.lib_deps}


; Explicit lab-only build. This is never a default environment and does not
; authorize production enablement or replace G0-HW/RELAY/OTA physical gates.
[env:esp32c6_hwless_rc]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
monitor_speed          = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
build_flags            =
    ${common.build_flags}
    -UENABLE_HARDWARELESS_RC
    -DENABLE_HARDWARELESS_RC=1
lib_deps               = ${common.lib_deps}
