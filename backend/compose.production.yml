name: smart-gatekeeper-production

services:
  db:
    image: ${DB_IMAGE_REPOSITORY:?DB image repository is required}@sha256:${DB_IMAGE_DIGEST:?DB image digest is required}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: smart_gatekeeper
      MARIADB_USER: ${DB_RUNTIME_USER:?existing or new MariaDB runtime user is required}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      TZ: UTC
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]

  migrate:
    image: ${DB_IMAGE_REPOSITORY:?DB image repository is required}@sha256:${DB_IMAGE_DIGEST:?DB image digest is required}
    restart: "no"
    command: ["/usr/local/bin/sgk-migrate", "up", "009"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: smart_gatekeeper
      DB_MIGRATION_USER: root
      DB_MIGRATION_PASSWORD_FILE: /run/secrets/db_root_password
      MIGRATION_SOURCE_COMMIT: ${BUILD_SHA:?exact 40-hex BUILD_SHA is required}
      MIGRATION_BACKUP_DIR: /var/backups/smart-gatekeeper
      TZ: UTC
    secrets:
      - db_root_password
    volumes:
      - migration_backups:/var/backups/smart-gatekeeper
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m

  api:
    image: ${API_IMAGE_REPOSITORY:?API image repository is required}@sha256:${API_IMAGE_DIGEST:?API image digest is required}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: smart_gatekeeper
      DB_USER: ${DB_RUNTIME_USER:?existing or new MariaDB runtime user is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      MQTT_HOST: ${MQTT_HOST:?MQTT_HOST is required}
      MQTT_PORT: "${MQTT_PORT:?MQTT TLS port is required}"
      MQTT_USER: ${MQTT_USER:?MQTT_USER is required}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      MQTT_CA_FILE: /run/secrets/mqtt_ca
      COMMAND_TARGET_ID: ${COMMAND_TARGET_ID:?COMMAND_TARGET_ID is required}
      COMMAND_TENANT_ID: ${COMMAND_TENANT_ID:?COMMAND_TENANT_ID is required}
      COMMAND_DOOR_ID: ${COMMAND_DOOR_ID:?COMMAND_DOOR_ID is required}
      COMMAND_SIGNING_KEY_ID: ${COMMAND_SIGNING_KEY_ID:?COMMAND_SIGNING_KEY_ID is required}
      COMMAND_SIGNING_PRIVATE_SCALAR_HEX_FILE: /run/secrets/command_signing_scalar
      HA_BRIDGE_ENABLED: ${HA_BRIDGE_ENABLED:-false}
      HA_BRIDGE_ALLOW_MANUAL_REMOTE: ${HA_BRIDGE_ALLOW_MANUAL_REMOTE:-false}
      HA_BRIDGE_STATUS_MAX_AGE_SECONDS: ${HA_BRIDGE_STATUS_MAX_AGE_SECONDS:-15}
      GATEKEEPER_API_KEY_FILE: /run/secrets/api_key
      OPS_HMAC_KEY_FILE: /run/secrets/ops_hmac_key
      ADMIN_MTLS_IDENTITIES_JSON_FILE: /run/secrets/admin_identities
      PERSONAL_ADMIN_PASSWORD_FILE: /run/secrets/personal_admin_password
      ADMIN_TRUSTED_PROXY_IPS: ${ADMIN_TRUSTED_PROXY_IPS:?trusted TLS proxy IPs are required}
      ACL_MANAGEMENT_ENABLED: "true"
      ACL_LEGACY_DEVICE_LOOKUP_ENABLED: "false"
      ACL_LEGACY_REF_HMAC_KEY_FILE: /run/secrets/acl_legacy_ref_hmac_key
      ACL_ENROLLMENT_AUTH_JSON_FILE: /run/secrets/acl_enrollment_auth
      ACL_ADMIN_API_KEY_FILE: /run/secrets/acl_admin_api_key
      ACL_TARGET_AUTH_JSON_FILE: /run/secrets/acl_target_auth
      ACL_SIGNING_PRIVATE_SCALAR_HEX_FILE: /run/secrets/acl_signing_scalar
      ACL_SIGNING_KEY_ID: ${ACL_SIGNING_KEY_ID:?ACL signing key ID is required}
      ACL_PERSONAL_ENROLLMENT_ENABLED: ${ACL_PERSONAL_ENROLLMENT_ENABLED:-false}
      ACL_PERSONAL_TENANT_ID: ${ACL_PERSONAL_TENANT_ID:-}
      ACL_PERSONAL_DOOR_ID: ${ACL_PERSONAL_DOOR_ID:-}
      EXPECTED_DB_SCHEMA_VERSION: "009"
      EXPECTED_DB_SCHEMA_SHA256: "5ffe2f22c145faa1441af76b873606af7015310402b7e3f08e7e97fdce9a507d"
      ADMIN_REAUTH_SECONDS: ${ADMIN_REAUTH_SECONDS:-900}
      BUILD_SHA: ${BUILD_SHA:?exact 40-hex BUILD_SHA is required}
      TARGET_CONFIG_FILE: /var/lib/smart-gatekeeper/target_config.json
      TZ: UTC
    secrets:
      - db_password
      - mqtt_password
      - mqtt_ca
      - api_key
      - ops_hmac_key
      - command_signing_scalar
      - admin_identities
      - personal_admin_password
      - acl_enrollment_auth
      - acl_legacy_ref_hmac_key
      - acl_admin_api_key
      - acl_target_auth
      - acl_signing_scalar
    volumes:
      - api_state:/var/lib/smart-gatekeeper
      - apk_artifacts:/app/gatekeeper_apk:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    # One routable bridge is intentional.  Docker Engine 24 on DSM cannot
    # select a deterministic default gateway for a multi-homed container, and
    # MQTTS timed out even when both candidate bridges were routable.  The DB
    # remains unpublished; sharing this bridge does not expose port 3306.
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 512m

networks:
  data:
    internal: false

volumes:
  mariadb_data: {}
  api_state: {}
  apk_artifacts:
    external: true
  migration_backups:
    external: true

secrets:
  db_root_password: {external: true}
  db_password: {external: true}
  mqtt_password: {external: true}
  mqtt_ca: {external: true}
  api_key: {external: true}
  ops_hmac_key: {external: true}
  command_signing_scalar: {external: true}
  admin_identities: {external: true}
  personal_admin_password: {external: true}
  acl_enrollment_auth: {external: true}
  acl_legacy_ref_hmac_key: {external: true}
  acl_admin_api_key: {external: true}
  acl_target_auth: {external: true}
  acl_signing_scalar: {external: true}
