<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Key — Gatekeeper Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #6366f1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans KR', 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .user-info-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .unit-number {
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-revoked {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Force Open Hero Button */
    .door-control-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .btn-force-open {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 40px var(--primary-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-force-open:hover, .btn-force-open:active {
      transform: scale(0.96);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.6);
    }

    .btn-force-open svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pulse-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: pulse 2s infinite;
      opacity: 0.6;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    /* Form Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #4f46e5);
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Log List */
    .logs-section h3 {
      font-size: 16px;
      margin-bottom: 14px;
      color: var(--text-muted);
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-title {
      font-size: 14px;
      font-weight: 600;
    }

    .log-time {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SMART GATEKEEPER</h1>
      <p>Synology NAS Powered Smart Key System</p>
    </header>

    <!-- 사용자 카드 -->
    <div class="glass-card user-info-card" id="userCard">
      <div class="user-details">
        <span class="user-name" id="userName">101호 홍길동 님</span>
        <span class="unit-number" id="unitNo">101호 세입자</span>
      </div>
      <div class="status-badge status-active" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">출입 승인 (Active)</span>
      </div>
    </div>

    <!-- Door Open Action Area -->
    <div class="glass-card door-control-section" id="activeSection">
      <button class="btn-force-open" onclick="triggerDoorOpen()">
        <div class="pulse-ring"></div>
        <svg viewBox="0 0 24 24">
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        </svg>
        <span>문 열기</span>
      </button>
      <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted);" id="actionStatus">
        버튼을 누르면 출입문 릴레이가 즉시 1초간 작동합니다.
      </p>
    </div>

    <!-- 가입 신청 Form (Pending / Unregistered) -->
    <div class="glass-card" id="signupSection" style="display: none;">
      <h2 style="font-size: 18px; margin-bottom: 16px;">세입자 권한 신청</h2>
      <form onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>이름</label>
          <input type="text" class="form-input" id="inputName" placeholder="예: 홍길동" required>
        </div>
        <div class="form-group">
          <label>동/호수</label>
          <input type="text" class="form-input" id="inputRoom" placeholder="예: 101호" required>
        </div>
        <button type="submit" class="btn-submit">권한 신청하기</button>
      </form>
    </div>

    <!-- 최근 출입 이력 -->
    <div class="glass-card logs-section" id="logsSection">
      <h3>최근 출입 이력</h3>
      <div id="logsList">
        <div class="log-item">
          <div>
            <div class="log-title">자동 감지 출입 (ToF)</div>
            <div class="log-time">오늘 22:15</div>
          </div>
          <span style="color: var(--success); font-size: 13px; font-weight:600;">승인됨</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function triggerDoorOpen() {
      const statusEl = document.getElementById('actionStatus');
      statusEl.innerText = "제어 명령 전송 중...";
      try {
        const res = await fetch('/api/v1/door/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: 'manual_click' })
        });
        if (res.ok) {
          statusEl.style.color = "#10b981";
          statusEl.innerText = "✅ 문이 성공적으로 열렸습니다!";
          setTimeout(() => {
            statusEl.style.color = "var(--text-muted)";
            statusEl.innerText = "버튼을 누르면 출입문 릴레이가 즉시 1초간 작동합니다.";
          }, 3000);
        } else {
          statusEl.style.color = "#ef4444";
          statusEl.innerText = "❌ 문 열기 요청 실패";
        }
      } catch (e) {
        statusEl.style.color = "#ef4444";
        statusEl.innerText = "❌ 서버 통신 에러";
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('inputName').value;
      const room = document.getElementById('inputRoom').value;

      try {
        const res = await fetch('/api/v1/user/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, room_no: room, device_id: 'WEB-UI-001' })
        });
        if (res.ok) {
          alert("가입 신청이 완료되었습니다. 관리자 승인을 기다려주세요.");
          location.reload();
        }
      } catch (err) {
        alert("신청 실패: " + err);
      }
    }
  </script>
</body>
</html>
