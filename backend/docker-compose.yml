version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: gatekeeper-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gatekeeper_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-smart_gatekeeper}
      MYSQL_USER: ${DB_USER:-gatekeeper_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gatekeeper_pass}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD || mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gatekeeper-api
    restart: always
    environment:
      # ── DB 연결 ──────────────────────────────────────────────
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_gatekeeper}
      DB_USER: ${DB_USER:-gatekeeper_user}
      DB_PASSWORD: ${DB_PASSWORD:-gatekeeper_pass}
      TZ: Asia/Seoul
      # ── MQTT Broker (v2.0 — gatekeeper/arm Pre-arm 발행용) ──
      # ESP32-C6가 구독 중인 MQTTS 브로커 접속 정보
      # 시놀로지 NAS의 MQTT 브로커 주소 및 포트를 .env 파일에 설정
      MQTT_HOST: ${MQTT_HOST:-172.17.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-gatekeeper_mqtt}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-gatekeeper_mqtt_pass}

      MQTT_USE_TLS: ${MQTT_USE_TLS:-false}

      MQTT_TOPIC_ARM: ${MQTT_TOPIC_ARM:-gatekeeper/arm}
      # ── 모바일 앱 Remote Config ──────────────────────────────
      GATEKEEPER_BEACON_UUID: ${GATEKEEPER_BEACON_UUID:-a1b2c3d4-e5f6-7890-abcd-ef1234567890}
      APP_COOLDOWN_SEC: ${APP_COOLDOWN_SEC:-10}
      # ── 문 제어 API 인증 키 (issue.md P3-22) ─────────────────
      # 비워 두면 키 인증이 비활성된다. 배포 순서는 .env.example 참조.
      GATEKEEPER_API_KEY: ${GATEKEEPER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - /volume1/docker/smartbox_ota/gatekeeper_apk:/app/gatekeeper_apk:ro


    depends_on:
      db:
        condition: service_healthy


volumes:
  mariadb_data:
