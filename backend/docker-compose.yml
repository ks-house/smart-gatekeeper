services:
  db:
    image: mariadb:10.11
    container_name: gatekeeper-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gatekeeper_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-smart_gatekeeper}
      MYSQL_USER: ${DB_USER:-gatekeeper_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gatekeeper_pass}
      TZ: Asia/Seoul
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/002_acl_management_expand_up.sql:/docker-entrypoint-initdb.d/02_acl_management_expand.sql:ro
      - ./db/migrations/003_admin_security_up.sql:/docker-entrypoint-initdb.d/03_admin_security.sql:ro
      - ./db/migrations/004_admin_control_v2_up.sql:/docker-entrypoint-initdb.d/04_admin_control_v2.sql:ro
      - ./db/migrations/005_force_open_reconciliation_up.sql:/docker-entrypoint-initdb.d/05_force_open_reconciliation.sql:ro
      - ./db/migrations/006_target_boot_state_up.sql:/docker-entrypoint-initdb.d/06_target_boot_state.sql:ro
      - ./db/migrations/007_ops_privacy_up.sql:/docker-entrypoint-initdb.d/07_ops_privacy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gatekeeper-api
    restart: always
    environment:
      # ── DB 연결 ──────────────────────────────────────────────
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_gatekeeper}
      DB_USER: ${DB_USER:-gatekeeper_user}
      DB_PASSWORD: ${DB_PASSWORD:-gatekeeper_pass}
      TZ: Asia/Seoul
      # Verified MQTTS backend publisher; all Target effects are signed.
      # ESP32-C6가 구독 중인 MQTTS 브로커 접속 정보
      # 시놀로지 NAS의 MQTT 브로커 주소 및 포트를 .env 파일에 설정
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CA_FILE: ${MQTT_CA_FILE:-/run/secrets/mqtt_ca.pem}
      COMMAND_TARGET_ID: ${COMMAND_TARGET_ID:-}
      COMMAND_TENANT_ID: ${COMMAND_TENANT_ID:-}
      COMMAND_DOOR_ID: ${COMMAND_DOOR_ID:-}
      COMMAND_SIGNING_KEY_ID: ${COMMAND_SIGNING_KEY_ID:-0}
      COMMAND_SIGNING_PRIVATE_SCALAR_HEX: ${COMMAND_SIGNING_PRIVATE_SCALAR_HEX:-}
      # ── 모바일 앱 Remote Config ──────────────────────────────
      GATEKEEPER_BEACON_UUID: ${GATEKEEPER_BEACON_UUID:-a1b2c3d4-e5f6-7890-abcd-ef1234567890}
      APP_COOLDOWN_SEC: ${APP_COOLDOWN_SEC:-10}
      APP_RSSI_THRESHOLD: ${APP_RSSI_THRESHOLD:--85}
      # ── 문 제어 API 인증 키 (issue.md P3-22) ─────────────────
      # 비워 두면 키 인증이 비활성된다. 배포 순서는 .env.example 참조.
      GATEKEEPER_API_KEY: ${GATEKEEPER_API_KEY:-}
      # ── Issue #19 Hardwareless RC ACL management (production-OFF) ──
      ACL_MANAGEMENT_ENABLED: ${ACL_MANAGEMENT_ENABLED:-false}
      ACL_LEGACY_DEVICE_LOOKUP_ENABLED: ${ACL_LEGACY_DEVICE_LOOKUP_ENABLED:-true}
      ACL_LEGACY_REF_HMAC_KEY: ${ACL_LEGACY_REF_HMAC_KEY:-}
      ACL_ENROLLMENT_AUTH_JSON: ${ACL_ENROLLMENT_AUTH_JSON:-}
      ACL_ADMIN_API_KEY: ${ACL_ADMIN_API_KEY:-}
      ACL_TARGET_AUTH_JSON: ${ACL_TARGET_AUTH_JSON:-}
      ACL_SIGNING_PRIVATE_SCALAR_HEX: ${ACL_SIGNING_PRIVATE_SCALAR_HEX:-}
      ACL_SIGNING_KEY_ID: ${ACL_SIGNING_KEY_ID:-1}
      ACL_TRANSITION_SIGNING_PRIVATE_SCALAR_HEX: ${ACL_TRANSITION_SIGNING_PRIVATE_SCALAR_HEX:-}
      ACL_TRANSITION_SIGNING_KEY_ID: ${ACL_TRANSITION_SIGNING_KEY_ID:-}
      ACL_LEASE_SECONDS: ${ACL_LEASE_SECONDS:-900}
      # Issue #49.  Empty is intentionally fail-closed for every admin route.
      # Map verified mTLS certificate SHA-256 fingerprints to subject/roles/scopes.
      ADMIN_MTLS_IDENTITIES_JSON: ${ADMIN_MTLS_IDENTITIES_JSON:-}
      ADMIN_SESSION_SECONDS: ${ADMIN_SESSION_SECONDS:-900}
      ADMIN_REAUTH_SECONDS: ${ADMIN_REAUTH_SECONDS:-120}
      ADMIN_TRUSTED_PROXY_IPS: ${ADMIN_TRUSTED_PROXY_IPS:-}
      PERSONAL_ADMIN_PASSWORD: ${PERSONAL_ADMIN_PASSWORD:-}
    # Personal NAS PROD: expose only on the NAS/LAN so DSM reverse proxy can
    # terminate public TLS on 4442. Router port forwarding must not expose 8000.
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - /volume1/docker/smartbox_ota/gatekeeper_apk:/app/gatekeeper_apk:ro
      - ${MQTT_CA_HOST_PATH:-./secrets/mqtt_ca.pem}:/run/secrets/mqtt_ca.pem:ro


    depends_on:
      db:
        condition: service_healthy


volumes:
  mariadb_data:
